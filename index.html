  {t:"「报一个跳一跳够得着的数。」", s:"一季度存款要净增0.12亿 · 做到了黄世海记着", fn:()=>{
    fav("huang",1); chal("kmh","开门红任务",1200,2,6,-6); S.flags.kmhLast="small";
    log("", "你报了一个数。黄世海在表上写下来，写完用笔在后面点了一下。"); }},
  {t:"「报个大数，先把会开过去。」", s:"一季度要净增0.25亿 · 当场好看 · 做不到更难看", fn:()=>{
    fav("huang",6); chal("kmh","开门红任务",2500,2,8,-12); S.flags.kmhLast="big";
    log("", "你报完，会议室里有人抬头看了你一眼。黄世海说：「这才像话。」"); }},
  {t:"「网点人手紧，数我回去算清楚再报。」", s:"黄世海不高兴 · 员工觉得你护着他们", fn:()=>{
    fav("huang",-6); allStaffFav(3); S.flags.kmhLast="none";
    log("bad", "黄世海把笔放下了：「那你回去算，算清楚。」散会后电梯里没人跟你说话。"); }},
 ]},

/* 2 适当性 */
{id:"sdx", title:"适当性", once:true, weight:3, when:S=>S.turn>=2 && staff("suxw") && card("zhangxf") && card("zhangxf").own>30,
 body:S=>`苏晓雯把张秀芬领进理财室，门一关，先给阿姨倒了杯水。\n\n「阿姨想要收益高点的。」她把一张产品单推到你面前，是一只权益基金，R4。张秀芬的测评是R2。\n\n「测评我陪阿姨重新做一遍，」苏晓雯压低声音，「阿姨自己也愿意。这个月中收就差这一口。」\n\n张秀芬捧着水杯，看看她，又看看你。`,
 opts:S=>[
  {t:"「阿姨，我们按您的等级来，给您看两款稳当的。」", s:"中收+0.8万 · 苏晓雯有点失望", fn:()=>{
    feeAdd(0.8); sfav("suxw",-3); fav("zhangxf",5);
    log("", "张秀芬买了一款一年期的稳健理财。苏晓雯出门时把产品单揉成一团，又展开，压平，放回了抽屉。"); }},
  {t:"「晓雯，你带阿姨把测评重新做一遍。」", s:"中收+4.5万 · 这事留了底", gray:true, fn:()=>{
    feeAdd(4.5); dirt(8); sfav("suxw",6); S.flags.dirtyWealth=(S.flags.dirtyWealth||0)+1;
    if(R()<0.6) schedule("complaintV", rint(3,6), {cardId:"zhangxf"});
    log("warn", "测评做了第二遍，结果是C4。张秀芬在双录的镜头前念完了那段话，念错了一个字，又重念了一遍。"); }},
  {t:"「晓雯，你先出去，我跟阿姨说。」", s:"一分中收没做 · 张秀芬记下了", fn:()=>{
    csatAdd(2); fav("zhangxf",12); sfav("suxw",-2);
    log("good", "你拿了张白纸，给张秀芬画了一条去年跌了百分之十五的曲线。她看了很久，说：「那我还是存定期。」"); }},
 ]},

/* 3 反诈 */
{id:"fanzha", title:"安全账户", once:true, weight:3, when:S=>S.turn>=4,
 body:S=>`上午十点，唐亮在大堂拦下一个老人。\n\n老人叫陈德贵，七十出头，手机贴在耳朵上一直没放下，要把二十万转到「安全账户」。唐亮问一句，他就往后退一步。\n\n「我儿子出事了，你们莫耽搁我。」\n\n电话那头的人还在说话。唐亮回头看你。`,
 opts:S=>{
  const tl = staff("tangliang");
  return [
  {t:"「先稳住他，我来报110。」", s:"占用本月1点行动 · 大概率拦得下", disabled:S.ap<1, fn:()=>{
    apUse(1); S.flags.fanzhaSaved = R()<0.92; fanzhaResult(S.flags.fanzhaSaved); }},
  {t:`「${tl?tl.name:"小唐"}，你陪他坐一下，找他儿子的电话。」`, s:`不占行动 · 成败看${tl?tl.name:"大堂"}`, fn:()=>{
    const p = 0.45 + (tl?tl.op:3)*0.05; S.flags.fanzhaSaved = R()<p; fanzhaResult(S.flags.fanzhaSaved); }},
  {t:"「他自己的钱，按流程办，让他签风险提示书。」", s:"省事", fn:()=>{
    schedule("fanzhaLost", 1);
    log("", "陈德贵在风险提示书上签了字，笔握得很紧，最后一笔拉出去老长。"); }},
 ];}},

/* 4 投诉 */
{id:"tousu", title:"投诉单", cd:6, weight:2, when:S=>S.turn>=3 && (S.biz.csat<78 || R()<0.3),
 body:S=>`支行转来一张投诉单。\n\n一位姓刘的老太太周二上午在弹子石排了一个半小时，中途起来两次，最后没办成。她女儿打的电话，话说得不好听，最后一句是「你们银行是不是只认有钱人」。\n\n支行在单子上批了四个字：限期回复。`,
 opts:S=>[
  {t:"「买箱水果，我下班去刘家一趟。」", s:S.biz.budget>=0.3?"营销费用-0.3万 · 投诉撤了":"自己掏的钱 · 投诉撤了", fn:()=>{
    if(S.biz.budget>=0.3) budgetAdd(-0.3); csatAdd(3);
    log("good", "刘家在六楼，没电梯。老太太开门看到你手里的水果：「你们主任亲自来的啊。」第二天支行说投诉撤了。"); }},
  {t:"「把那天的柜员叫来，查清楚是谁的窗口。」", s:"合规扣分 · 柜员不高兴", fn:()=>{
    const t = firstTeller(); compAdd(-3); csatAdd(1); if(t) sfav(t.id,-8);
    log("", `是${t?t.name:"柜员"}的窗口。那天上午系统卡了四十分钟，${t?pr(t):"她"}没解释，只说了句「晓得了」。`); }},
  {t:"「按模板回复，说明当日业务量大。」", s:"合规扣分 · 满意度下降", fn:()=>{
    compAdd(-3); csatAdd(-2);
    log("", "回复发出去了。三天后刘家女儿在小区业主群里转了一张截图。"); }},
 ]},

/* 5 黄世海·压指标 */
{id:"huang1", title:"加担子", fixed:true, when:S=>S.turn===3,
 body:S=>`黄世海把你叫到支行。他的烟灰缸是满的，窗户开着一条缝。\n\n「分行给南岸加了担子。」他把一张表转过来，弹子石那一栏后面用红笔添了个数，「上半年再多扛两千万。南坪邓宇已经认了。」\n\n他点了根烟，等你开口。`,
 opts:S=>[
  {t:"「认。」", s:"黄世海满意 · 到6月底存款要净增0.3亿", fn:()=>{
    fav("huang",8); chal("h1","上半年加压任务",3000,3,6,-10);
    log("", "黄世海把烟灰弹了弹：「这就对了嘛。」"); }},
  {t:"「认可以。您给弹子石批点营销费用。」", s:"营销费用+2万 · 到6月底净增0.22亿", fn:()=>{
    budgetAdd(2); fav("huang",2); chal("h1","上半年加压任务",2200,3,4,-6);
    log("", "黄世海看了你两秒，在另一张单子上签了字：「你倒是会算账。」"); }},
  {t:"「黄行，弹子石现在五个人，这个数扛不起。」", s:"黄世海不高兴 · 员工觉得你护着他们", fn:()=>{
    fav("huang",-10); allStaffFav(4);
    log("bad", "黄世海没接话，把表收回去，拿起了座机。你出门的时候他已经在给南坪打电话了。"); }},
 ]},

/* 6 黄世海·季末时点 */
{id:"huang2", title:"九月二十八号", fixed:true, when:S=>S.turn===9,
 body:S=>`九月二十八号，黄世海打电话来，声音压得很低。\n\n「三十号下午有笔钱进你那儿，三千万，一个小贷公司的。一号早上走。」他顿了一下，「季末排名分行要看。你让柜台接一下就行。」\n\n去年分行刚为存款偏离度通报过两家支行。`,
 opts:S=>[
  {t:"「晓得了，黄行。」", s:"季末存款+0.3亿，十月初转走 · 黄世海记你一功 · 这事有底", gray:true, fn:()=>{
    dirt(10); fav("huang",10); S.biz.timepoint = 3000; S.flags.huangDeal=(S.flags.huangDeal||0)+1;
    log("warn", "三十号下午四点五十，三千万进了账。何静看了一眼金额，什么都没问。"); }},
  {t:"「这笔我接不了，偏离度在查。」", s:"黄世海不高兴 · 分行有人听说了", fn:()=>{
    fav("huang",-8); fav("gu",5);
    log("", "电话那头沉默了几秒：「行，你清高。」"); }},
  {t:"「您给我发个书面通知，我照办。」", s:"钱不会来 · 黄世海记住了", fn:()=>{
    fav("huang",-4); S.flags.askedPaper = 1;
    const r = S.rivals.find(x=>x.id==="haitangxi"); if(r) r.bonus = 8;
    log("", "电话那头骂了一句，挂了。三十号那笔钱去了海棠溪。"); }},
 ]},

/* 7 黄世海·签字 */
{id:"huang3", title:"一份贷后报告", fixed:true, when:S=>S.turn===16,
 body:S=>`黄世海递过来一份贷后检查报告，借款人是渝顺商贸，地址在弹子石老街，离你的网点五百米。\n\n「你离得近，签个字，证明去看过了。」他翻到最后一页，笔帽已经拔了，「这家老板我认得，没得问题。」\n\n报告上写着：库存充足，经营正常。你没去过。`,
 opts:S=>[
  {t:"你签了字，把笔还给他。", s:"黄世海好感大涨 · 你的名字在这份报告上", gray:true, fn:()=>{
    dirt(12); fav("huang",12); S.flags.signedHuang = 1;
    log("warn", "黄世海把报告收进抽屉，拍了拍你的肩膀：「这才是自己人。」"); }},
  {t:"「我下午去看一眼，看了再签。」", s:"下个月少1点行动 · 看到什么写什么", fn:()=>{
    S.flags.apDebt = (S.flags.apDebt||0)+1; fav("huang",-15); fav("gu",10); meet("gu"); S.flags.exposedHuang = 1;
    keyEvent("在贷后报告上如实写下「库存与账面不符」");
    log("", "下午三点你到了渝顺商贸。卷帘门拉起一半，里面堆着几十个空纸箱。你在报告上写「库存与账面不符」，签了名，复印了一份自己留着。"); }},
  {t:"「让罗建去看，他跑外拓熟。」", s:"罗建签的字 · 罗建不太痛快", gray:true, fn:()=>{
    dirt(4); sfav("luojian",-8); fav("huang",4); S.flags.luoSigned = 1;
    log("", "罗建去了二十分钟就回来了，在报告上签了名。他没说看到了什么，你也没问。"); }},
 ]},

/* 8 断卡 */
{id:"duanka", title:"开卡", once:true, weight:2, when:S=>S.turn>=3,
 body:S=>{ const t = firstTeller(); return `一个二十出头的小伙子在柜台前坐下，要开一张一类卡。\n\n${t.name}看了他的身份证，户籍是外省，开户理由写的「找工作发工资」。问是哪家公司，小伙子想了一下，说还没定。\n\n系统显示他这周在南岸已经开过两张卡了。${t.name}把身份证放在台面上，没有递回去。`; },
 opts:S=>{ const t = firstTeller(); return [
  {t:"「按断卡要求，请他说清楚用途，说不清就不办。」", s:"合规加分 · 这人走的时候骂了一句", fn:()=>{
    compAdd(2); csatAdd(-1); sfav(t.id,3);
    log("", `小伙子起身把椅子踢了一下。${t.name}把这张开户申请拍了照，发到了支行运营群。`); }},
  {t:"「给他开个二类户，限额低，出不了大事。」", s:"有效客户+1 · 留了个尾巴", fn:()=>{
    custAdd(1); if(R()<0.3) schedule("duankaLater", rint(2,4), {soft:true});
    log("", "二类户开出去了，单日限额五千。小伙子拿着卡看了看，走了。"); }},
  {t:"「开吧，有效客户也是客户。」", s:"有效客户+1 · 出事了要追责", gray:true, fn:()=>{
    custAdd(1); dirt(5); if(R()<0.7) schedule("duankaLater", rint(2,4), {soft:false});
    log("warn", `${t.name}把身份证递了回去，没看你。`); }},
 ];}},

/* 9 辞职 */
{id:"lizhi", title:"一张纸", cd:4, weight:4, when:S=>S.turn>=3 && !!stressed(),
 pick:S=>({sid: stressed().id}),
 body:(S,d)=>{ const e = staff(d.sid); return `下班后${e.name}没走，在你门口站了一会儿才敲门。\n\n${pr(e)}把一张纸放在桌上，折过两道。「${S.turn>12?S.player.sur+"主任":"领导"}，我想了很久。」\n\n纸上写的是辞职申请。`; },
 opts:(S,d)=>{ const e = staff(d.sid); if(!e) return [{t:"算了。", s:"", fn:()=>{}}]; return [
  {t:"「先别交，歇一周再说。」", s:`${e.name}休一周 · 本月少一个人干活`, fn:()=>{
    e.fatigue = c100(e.fatigue-45); e.off = S.turn; sfav(e.id,6);
    log("", `${e.name}把纸收回去了。第二天${pr(e)}的工位空着，桌上的仙人掌被唐亮挪到了窗台上。`); }},
  {t:"「我去支行给你争取一下绩效。」", s:"营销费用-1万，拿去补绩效", disabled:S.biz.budget<1, fn:()=>{
    budgetAdd(-1); sfav(e.id,10); e.fatigue = c100(e.fatigue-15);
    log("", `你在黄世海办公室坐了半个小时。月底${e.name}的绩效多了一千块，${pr(e)}没提这事，把辞职申请塞进了碎纸机。`); }},
  {t:"「好，我签字。」", s:`${e.name}走了 · 下个月来个新人`, fn:()=>{
    staffLeave(e.id); allStaffFav(-3);
    log("bad", `${e.name}最后一天把工牌交给了何静。晚上网点群里有人发了个「一路顺风」，没人接。`); }},
 ];}},

/* 10 短款 */
{id:"changkuan", title:"日终轧账", cd:8, weight:2, when:S=>S.turn>=3 && S.staff.some(s=>s.role==="teller"),
 pick:S=>({sid: pick(S.staff.filter(s=>s.role==="teller")).id}),
 body:(S,d)=>{ const e = staff(d.sid); return `日终轧账，${e.name}的尾箱短了两千块。\n\n${pr(e)}把钞票又点了三遍，脸是白的。何静在旁边帮着把当天的凭证一张张翻出来。`; },
 opts:(S,d)=>{ const e = staff(d.sid); return [
  {t:"「按规定报差错，该怎么扣怎么扣。」", s:"合规扣分 · 零差错记录断了", fn:()=>{
    compAdd(-2); resetNoErr(); sfav(e.id,-2);
    log("", `差错单是${e.name}自己填的，字写得很工整。`); }},
  {t:"「让她自己先补上，这事不往上报。」".replace("她", pr(e)), s:"记录保住了 · 欠你一个人情", gray:true, fn:()=>{
    dirt(4); sfav(e.id,6);
    log("warn", `第二天一早，${e.name}的尾箱里多了两千块，崭新的，连号。`); }},
  {t:"「调监控，一张一张对。」", s:"占用1点行动 · 七成能找回来", disabled:S.ap<1, fn:()=>{
    apUse(1);
    if(R()<0.7){ sfav(e.id,5); log("good", `监控看到第四十分钟，一位客户多拿了一沓。唐亮打电话过去，对方第二天上午把钱送了回来。`); }
    else { compAdd(-2); resetNoErr(); log("", "监控看到晚上九点，没找到。差错还是报了。"); }
  }},
 ];}},

/* 11 双录抽查 */
{id:"shuanglu", title:"抽查", once:true, fixed:true, when:S=>S.turn>=10 && (R()<0.25 || S.turn>=20),
 body:S=>`顾清越没打招呼就来了，自己拎着水杯。\n\n「风险条线抽查，」她在理财室坐下，「把这半年的双录调出来，我看三十条。」\n\n苏晓雯去开电脑，手在鼠标上停了一下。`,
 opts:S=>{
  meet("gu");
  const dirty = (S.flags.dirtyWealth||0) > 0;
  const arr = [
  {t:"「都调出来，顾总随便看。」", s:"如实接受检查", fn:()=>{
    if(dirty){ compAdd(-10); fav("gu",4); log("bad", "她看到第十七条停了下来，把那条又放了一遍，在本子上写了一行。走的时候说：「整改报告下周五给我。」"); }
    else { compAdd(3); fav("gu",10); keyEvent("风险条线飞行检查零问题"); log("good", "三十条看完，她在本子上写了两行字。走的时候说了句「还行」。"); }
  }},
  {t:"「中午了，顾总在这边吃个便饭？」", s:"……", fn:()=>{
    fav("gu",-8);
    if(dirty) compAdd(-10); else compAdd(2);
    log("", "「我带了饭。」她没抬头。"); }},
  ];
  if(dirty) arr.push({t:"「晓雯，先把那几条补一补。」", s:"补录能糊过去就糊过去", gray:true, fn:()=>{
    dirt(10);
    if(R()<0.45){ compAdd(-15); fav("gu",-15); S.flags.guCaught = 1; log("bad", "顾清越看到了录像的时间戳。她把电脑合上，看着你：「这个，我要写进报告。」"); }
    else { fav("gu",2); log("warn", "补录的那几条她没点开。苏晓雯送她到门口，回来靠在墙上站了很久。"); }
  }});
  return arr;
 }},

/* 12 挖客户 */
{id:"wajiao", title:"一桶油", once:true, weight:2, when:S=>S.turn>=5 && card("zhangxf") && card("zhangxf").own>50,
 body:S=>`张秀芬打来电话。对面那家股份行的小姑娘来家里坐了一下午，还拎了一桶油。\n\n「人家一年期比你们多零点三，」她在电话里笑，「我跟她说，我要问问小${S.player.sur}。」`,
 opts:S=>{ const c = card("zhangxf"); return [
  {t:"「阿姨，我明天上午来家里。」", s:"占用1点行动 · 稳住了", disabled:S.ap<1, fn:()=>{
    apUse(1); fav("zhangxf",10); c.maint = true;
    log("good", "张秀芬家的茶几上真放着一桶油。她给你削了个苹果，说：「我就是想看你来不来。」"); }},
  {t:"「我去支行申请利率上浮。」", s:"黄世海嫌你麻烦 · 客户留下", fn:()=>{
    fav("huang",-3); fav("zhangxf",3);
    log("", "黄世海签字的时候问了一句：「一个老太婆，至于吗？」"); }},
  {t:"「零点三确实多，阿姨您自己拿主意。」", s:"张秀芬转走一部分", fn:()=>{
    const out = Math.round(c.own*0.5); c.own -= out; c.other += out; fav("zhangxf",-10);
    log("bad", `第二周张秀芬来取了一笔，${fmtWan(out)}。她在柜台前多站了一会儿，说下回再来。`); }},

{id:"kaoyu", title:"烤鱼", once:true, weight:2, when:S=>S.turn>=2,
 body:S=>`万州烤鱼有个连锁老板来找你，要在主城和成都开二十家店，想贷八千万。\n\n他带来一盘烤鱼，放在会议桌中间，还冒着热气。「行长，你尝一口，尝了再说。」`,

{id:"gu3", title:"顾清越来万州", once:true, fixed:true, when:S=>S.turn>=4 && (R()<0.3 || S.turn>=7),
 body:S=>`顾清越来万州，坐的是早班高铁，没让人接。\n\n她在风险部待了一整天，汪明的门第一次开了一整天。傍晚她来你办公室，手里一张纸：「不良率${nplRatioL3().toFixed(2)}%。」她把纸放下，「你打算怎么办？」`,

    fav("gu",-8);

{id:"lu3", title:"陆明远", once:true, weight:3, when:S=>S.turn>=5,
 body:S=>`陆明远来万州开现场会，会后在江边走了一段。\n\n他在一截石阶上停下来，看着江对面：「南岸那几年，你批过的东西，有人在翻。」\n\n风很大，他的话吹散了一半。`,

{id:"quli", title:"区里的电话", once:true, weight:2, when:S=>S.turn>=3,

 ];}},

  const b = BALANCE.L2;
  S.loanBook.push({id:"l3_"+S.loanBook.length, name, amt, tier, src:"event", lv:3, at:S.monthAbs, defAt:S.monthAbs + ri(b.defaultDelay), def: R() < b.tierDefault[tier], done:false});

const CRISIS_L4 = {
  run: [
    {title:"谣言", body:S=>`周五晚上，一条语音在涪陵几个业主群里转：泰和银行要倒了，钱取不出来了。\n\n周六早上八点，涪陵分行营业部门口排了一百多人。郑天明打来电话，背景里有人在喊。`,
     opts:[{t:"「全部网点延时营业，现金从主城调，要多少调多少。」", good:true, s:"成本高 · 稳人心"},{t:"「先限额，每人每天五万。」", s:"省现金 · 可能火上浇油"}]},
    {title:"第二天", body:S=>`队伍排到了第二天。本地电视台的车停在街对面。\n\n公安那边来电话，说谣言的源头找到了，是个做民间借贷的，想让大家把钱转到他那里。`,
     opts:[{t:"「请公安发通报，我去营业部门口站着。」", good:true, s:"下季少1点行动"},{t:"「让涪陵分行自己处理，分行发个声明。」", s:"省事"}]},
    {title:"第三天", body:S=>`第三天上午，队伍短了一半。有人把取出来的钱又存了回来。\n\n郑天明发来一张照片：营业部的地上全是矿泉水瓶和废号票。`,
     opts:[{t:"「今天之内，把每个来过的人回访一遍。」", good:true, s:"费人力 · 收尾干净"},{t:"「好了，大家辛苦了。」", s:"到此为止"}]},
  ],
  client: [
    {title:"渝江物流", body:S=>`魏临川被带走了。消息是凌晨两点传来的，渝江物流的财务总监在电话里哭。\n\n上市的材料里，有一部分收入是假的。泰和银行是牵头行，贷款余额二十个亿。`,
     opts:[{t:"「连夜冻结账户，资产保全，天亮前报总行和监管。」", good:true, s:"狠 · 该做的"},{t:"「先等一等，看看情况。」", s:"……"}]},
    {title:"三百家", body:S=>`渝江物流上下游三百多家小企业，账期全在它身上。\n\n早上有二十几个小老板堵在分行楼下，有人认得你，喊你的名字。`,
     opts:[{t:"「供应链上的小企业，单独开个续贷通道。」", good:true, s:"不良多一点 · 保住一片"},{t:"「按合同，一律催收。」", s:"干净 · 一片哀声"}]},
    {title:"尽调报告", body:S=>`监管局的函到了，要求说明牵头行尽调情况。\n\n${S.flags.weiIPO==="loose"?"那份八十页的尽调报告，就在你的抽屉里。":"那份三百页的尽调报告，就在你的抽屉里。"}`,
     opts:[{t:"「报告原样交上去。」", good:true, s:"该担的担"},{t:"「报告先让法务过一遍。」", s:"拖一拖"}]},
  ],
};
function crisisEventSpec(){
  const c = S.biz.crisis; const k = c.kind, st = c.stage;
  const a = CRISIS_L4[k][st];
  return applyEventOdds({kind:"event", id:"crisis", title:`危机 · ${a.title}`, body:a.body(S), opts:a.opts.map(o=>({t:o.t, s:o.s, fn:()=>{
    if(o.good) c.good++;
    if(k==="client" && st===0){ const amt = 200000; inst("yyb").npl += amt; person("weilc").pos = "（被带走调查）"; person("weilc").recent = "渝江物流出事"; }
    if(k==="client" && st===1 && o.good) inst("yyb").npl += 30000;
    if(k==="run" && st===0 && o.good) S.month.spent += 800;
    if(k==="run" && st===1 && o.good) S.flags.apDebt = (S.flags.apDebt||0)+1;
    if(k==="client" && st===2 && S.flags.weiIPO==="loose" && o.good){ fav("gu",4); S.biz.crisisAdj += 0.3; }
    c.stage++;
    if(c.stage >= 3){
      c.done = true;
      if(c.good >= 2){ S.biz.crisisAdj += B4().rating.crisisGood; S.flags.crisisGood = true; keyEvent(k==="run" ? "平息涪陵挤兑谣言" : "处置渝江物流风险事件"); log("gold", "事情过去了。总行的通报里有一句：重庆分行处置及时。"); }
      else { S.biz.crisisAdj += B4().rating.crisisBad; fav("songwy",-6); log("bad", "事情过去了。总行的通报里有一句：重庆分行应对迟缓。"); }
    }
  }}))}, `crisis:${k}${st}`);
}

{id:"gu5", title:"金融监管总局", once:true, fixed:true, when:S=>S.turn===2,
 body:S=>`顾清越的约谈通知发到了总行办公室。她现在在金融监管总局，管大型银行。\n\n见面的时候，她没寒暄：「行长，」她第一次这么叫你，「泰和这几年的不良，是怎么降下来的，我要看底稿。」\n\n她面前还是一个笔记本。`,
 opts:S=>[
  {t:"「底稿都在，你随时来看。」", s:S.core.clean>=75?"坦荡":"……", fn:()=>{ if(S.core.clean>=75){ fav("gu",8); S.biz.regScore = Math.min(10,(S.biz.regScore||0)+3); log("good", "顾清越带人看了两周底稿。走的时候，她跟你说了一句：「弹子石那份贷后报告，我也看了。」"); } else { fav("gu",-6); S.kpi.comp = c100(S.kpi.comp-8); log("bad", "两周后，监管意见书写了四页。第三页有一段，讲的是重庆分行的几笔展期。"); } }},
  {t:"「有些是历史问题，现在的班子在处置。」", s:"顾清越不满意", fn:()=>{ fav("gu",-8); log("", "「历史。」她还是那样重复了一遍，合上了本子。"); }},
 ]},

/* 资本窗口 */
{id:"capwin", title:"窗口", cd:2, fixed:true, when:S=>S.turn===4 || S.turn===6,
 body:S=>`资负部的总经理来汇报：债券市场这个月利率低，二级资本债的窗口开了。\n\n「发一千亿，资本充足率能上去一个点，」他把一张表放在桌上，「但是分子大了，ROE 要掉。」\n\n现在的资本充足率是${carL5().toFixed(1)}%。`,
 opts:S=>[
  {t:"「发。」", s:"资本+1000亿 · ROE 掉一点", fn:()=>{ const r = issueCapital(); if(!r.ok) log("bad", `资本债的方案报上去，没批下来：${r.why}。`); }},
  {t:"「再等等。」", s:"不发", fn:()=>{ log("", "窗口关了。资负部的总经理把那张表收回去了。"); }},
 ]},

/* 陆明远退休 */
{id:"lu5", title:"送别", once:true, fixed:true, when:S=>S.turn===3,
 body:S=>`陆明远到龄了。欢送会在总行食堂，他不让摆花，也不让念稿子。\n\n轮到他讲话，他站起来，看了一圈，最后看着你：${S.evDone && S.evDone.luxun ? "「很多年前，我在重庆一个网点问一个年轻人，你们一年流失多少客户。」" : "「我当年在重庆当分行行长的时候，南岸有个网点负责人。」"}\n\n他停了很久。「后来他坐到了这个位置。」\n\n食堂里有人鼓掌，他摆摆手，坐下了。`,
 opts:S=>[
  {t:"散会后，你送他到楼下，陪他站了一会儿。", s:"", fn:()=>{ fav("lu",10); const lu = person("lu"); lu.pos = "退休"; lu.recent = "退休那天，你送他到楼下"; keyEvent("陆明远退休，你送他到楼下");
    log("gold", "车来之前，陆明远把手插在口袋里：「银行这碗饭，要吃得干净。」车门关上了，他没摇下车窗。"); }},
  {t:"你让秘书准备了一份礼物，自己回了办公室。", s:"", fn:()=>{ const lu = person("lu"); lu.pos = "退休"; lu.recent = "退休了"; log("", "秘书回来说，陆行没收礼物，让带一句话：好好干。"); }},
 ]},

/* 周启明的信 */
{id:"zhou5", title:"一封信", once:true, fixed:true, when:S=>S.turn===4 && !!person("zhouqm"),
 body:S=>`周启明退休了。他寄来一封信，手写的，三页。\n\n信里讲的是南岸那年的开门红，${S.flags.kmhLast==="big"?"你报了个大数，他在表上写下来，心里想这个年轻人要么出息要么出事":"你报的那个数，他后来在班子会上念过两次"}。最后一行写着：「${S.player.sur}行长，我当年叫你小${S.player.sur}，没想到。」`,
 opts:S=>[
  {t:"你回了一封信，也是手写的。", s:"", fn:()=>{ fav("zhouqm",8); log("good", "你写了两个晚上。信寄出去以后，周启明打来电话，只说了一句「收到了」，那边有孙子在喊爷爷。"); }},
  {t:"你让秘书代回了一封。", s:"", fn:()=>{ log("", "秘书的字写得很工整。周启明后来没再写信来。"); }},
 ]},

/* 弹子石 */
{id:"dzs5", title:"弹子石", once:true, fixed:true, when:S=>S.turn===5,
 body:S=>{ const hj = person("hejing"); const closed = S.evDone && S.evDone.dzs4 && !(S.track.keyEvents||[]).some(k=>/弹子石从撤并名单/.test(k.txt));
   return closed ? `一封信转到了你的办公室，信封上写着「泰和银行行长收」，寄件地址是弹子石老街。\n\n写信的是${hj?hj.name:"何静"}。弹子石网点撤掉以后，她去了南坪，今年退休。信里夹了一张照片：叫号机搬上货车的那天，她站在旁边。`
                 : `一封信转到了你的办公室，信封上写着「泰和银行行长收」，寄件地址是弹子石网点。\n\n写信的是${hj?hj.name:"何静"}，她今年退休。信里夹了一张照片：网点门口，新换的叫号机旁边，站着现在的五个员工，都很年轻。`; },

  {t:"你让办公室回了一封感谢信。", s:"", fn:()=>{ log("", "感谢信是打印的，落款盖着总行办公室的章。"); }},

/* 年轻人的信 */
{id:"young5", title:"一个网点负责人", once:true, fixed:true, when:S=>S.turn===6,
 body:S=>`行长信箱里有一封邮件，是贵州一个县里的网点负责人写的，三十岁。\n\n上级让他们给老人推一款基金，他不想推。支行的意思是，不推就扣绩效。「行长，我该怎么办？」\n\n邮件的最后，他写了自己的名字和工号。`,
 opts:S=>[
  {t:"你批转给合规部：这款产品在全国的销售，全部查一遍。", s:"合规加分 · 零售条线不高兴", fn:()=>{ S.kpi.comp = c100(S.kpi.comp+5); S.month.spent += 200000; keyEvent("一封行长信箱的邮件，查了一款产品的全国销售"); log("good", "查了两个月，停了那款产品的销售。那个网点负责人没有再写信来，后来你在一份评优名单上看到了他的名字。"); }},
  {t:"你让人回复他：按制度办。", s:"", fn:()=>{ log("", "回复是模板，四行。你在批示栏签了个「阅」。"); }},
 ]},
];

/* 过渡期:支行副行长两年 */
function transitionText(S, succ){
  const sur = S.player.sur;
  const out = [];
  out.push("副行长的办公室在支行二楼。你分管个金和运营，弹子石成了你每周要去的地方之一。");
  if(succ) out.push(`弹子石交给了${succ.name}。头一个月${pr(succ)}每天给你打两个电话，第三个月变成一周一个。`);
  if(S.flags.signedHuang){
    out.push("第二年秋天，黄世海被分行纪委带走。渝顺商贸那份贷后报告上有你的签名，你被叫去谈了两次话。第二次谈完，你在停车场坐到天黑。");
  } else if(S.flags.exposedHuang){
    out.push("第二年秋天，黄世海被分行纪委带走。案卷里最早的一页，是你写着「库存与账面不符」的那份报告。");
  } else {
    out.push("第二年秋天，黄世海被带走配合调查，牵出来的是几笔说不清的过桥。");
  }
  out.push(`十一月，分行的任命下来了。南岸支行行长，${sur}${S.player.given}。`);
  return out;
}

/* L5 终局评定 */
function finalL5(){
  const e = BALANCE.L5.endScore;
  const avg = S.biz.scoreLog.length ? S.biz.scoreLog.reduce((a,x)=>a+x,0)/S.biz.scoreLog.length : S.kpi.score;
  S.track.finalAvg = r1(avg);
  const bt = (S.track.btLv||[]);
  if(S.core.clean < 45) return "caught";
  if(S.core.clean >= 90 && (S.track.minClean||100) >= 90 && avg >= e.mid) return "clean";
  if([1,2,3].every(l => bt.includes(l))) return "bt3";
  if(avg >= e.top && rankL5() <= 2) return "top";
  if(avg >= e.mid) return "mid";
  return "low";
}

function bioData(){
  const ke = S.track.keyEvents || [];
  const stages = [];
  const ageOf = re => { const k = ke.find(x=>re.test(x.txt)); return k ? k.age : null; };
  const a1 = BALANCE.start.age, a2 = ageOf(/任南岸支行行长/), a3 = ageOf(/任万州分行行长/), a4 = ageOf(/任重庆分行行长/), a5 = ageOf(/任泰和银行行长/);
  const endAge = S.over ? S.over.age : S.age;
  const rows = [
    {lv:1, name:"弹子石网点负责人", from:a1, to:ageOf(/任南岸支行副行长/) || (a2 ? a2-2 : endAge)},
    {lv:2, name:"南岸支行行长", from:a2, to: ageOf(/任万州分行副行长/) || (a3 ? a3-2 : endAge)},
    {lv:3, name:"万州分行行长", from:a3, to: ageOf(/任重庆分行副行长/) || (a4 ? a4-2 : endAge)},
    {lv:4, name:"重庆分行行长", from:a4, to: ageOf(/任总行副行长/) || (a5 ? a5-3 : endAge)},
    {lv:5, name:"泰和银行行长", from:a5, to: endAge},
  ].filter(r => r.from != null);
  rows.forEach(r => {
    const ev = ke.filter(k => k.lv === r.lv && !/^(\d+)岁，任/.test(k.txt) && !/综合考核/.test(k.txt));
    r.best = ev.length ? ev[0].txt : "——";
  });
  // 带出来的人:你的旧部里现在位置最高的三个
  const rank = p => /行长/.test(p.pos) ? (/分行行长|分行副行长/.test(p.pos) ? 3 : 2) : (/负责人|总经理|总监/.test(p.pos) ? 1 : 0);
  const people = S.people.filter(p => (p.kind==="sub" || p.kind==="staff") && p.lvMet <= 3 && p.alive && p.pos.indexOf("离职")<0 && !["zhouqm","duheng","shenlan","jianggd"].includes(p.id))
    .sort((a,b) => rank(b)-rank(a) || (b.skill||0)-(a.skill||0)).slice(0,3).map(p => ({name:p.name, pos:p.pos}));
  const title = S.lv >= 5 ? "行长" : titleOf(S);
  return {name:S.player.sur+S.player.given, title, rows, people, core:Object.assign({}, S.core), ending:S.over ? S.over.title : "", age:endAge, verdict: bioVerdict()};
}
function bioVerdict(){
  const c = S.core;
  if(c.clean >= 90) return "签过的字，都经得起翻。";
  if(c.clean < 60) return "有些事，终究没能翻过去。";
  if(c.rep >= 75) return "带出来的人，后来都记得他。";
  if(c.perf >= 80) return "数字一直好看。";
  return "一路走到了这里。";
}
function drawBio(canvas){

  const g = canvas.getContext && canvas.getContext("2d");
  if(!g) return false;
  g.scale(dpr, dpr);
  const serif = '"Songti SC","STSong","Noto Serif CJK SC",serif', sans = '-apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
  g.fillStyle = "#f5f1e8"; g.fillRect(0,0,W,H);

  let y = 310;
  g.strokeStyle = "#a8894a"; g.lineWidth = 2;
  g.beginPath(); g.moveTo(pad+8, y-10); g.lineTo(pad+8, y + d.rows.length*150 - 60); g.stroke();
  d.rows.forEach(r => {
    g.fillStyle = "#a8894a"; g.beginPath(); g.arc(pad+8, y+4, 8, 0, Math.PI*2); g.fill();
    g.fillStyle = "#1d2522"; g.font = `bold 26px ${serif}`; g.fillText(r.name, pad+36, y+12);
    g.fillStyle = "#6c716c"; g.font = `17px ${sans}`; g.fillText(`${r.from}岁 — ${r.to}岁`, pad+36, y+44);
    g.fillStyle = "#23463f"; g.font = `19px ${serif}`;
    wrapText(g, r.best, pad+36, y+82, W - pad*2 - 40, 30);
    y += 150;
  });
  y += 20;
  g.fillStyle = "#1d2522"; g.font = `bold 22px ${serif}`; g.fillText("带出来的人", pad, y); y += 40;
  if(!d.people.length){ g.fillStyle = "#6c716c"; g.font = `18px ${sans}`; g.fillText("——", pad, y); y += 40; }
  d.people.forEach(p => { g.fillStyle = "#1d2522"; g.font = `20px ${serif}`; g.fillText(p.name, pad, y); g.fillStyle = "#6c716c"; g.font = `17px ${sans}`; g.fillText(p.pos, pad+110, y); y += 40; });
  // 四维雷达
  y += 30;
  g.fillStyle = "#1d2522"; g.font = `bold 22px ${serif}`; g.fillText("四项", pad, y);
  const cx = W/2, cy = y + 170, R = 120;
  const keys = [["perf","业绩"],["rep","口碑"],["trust","上级信任"],["clean","干净"]];
  g.strokeStyle = "#d9d2c1"; g.lineWidth = 1;
  [0.25,0.5,0.75,1].forEach(k => { g.beginPath(); keys.forEach((_,i)=>{ const a = -Math.PI/2 + i*Math.PI/2; const px = cx + Math.cos(a)*R*k, py = cy + Math.sin(a)*R*k; i ? g.lineTo(px,py) : g.moveTo(px,py); }); g.closePath(); g.stroke(); });
  g.beginPath();
  keys.forEach(([k],i) => { const a = -Math.PI/2 + i*Math.PI/2, v = (d.core[k]||0)/100; const px = cx + Math.cos(a)*R*v, py = cy + Math.sin(a)*R*v; i ? g.lineTo(px,py) : g.moveTo(px,py); });
  g.closePath(); g.fillStyle = "rgba(168,137,74,.35)"; g.fill(); g.strokeStyle = "#a8894a"; g.lineWidth = 2; g.stroke();
  g.fillStyle = "#1d2522"; g.font = `17px ${sans}`; g.textAlign = "center";
  keys.forEach(([k,n],i) => { const a = -Math.PI/2 + i*Math.PI/2; g.fillText(`${n} ${Math.round(d.core[k]||0)}`, cx + Math.cos(a)*(R+44), cy + Math.sin(a)*(R+30) + 6); });
  g.textAlign = "left";
  y = cy + R + 90;
  g.fillStyle = "#16302b"; g.fillRect(0, y-10, W, H-y+10);
  g.fillStyle = "#f3edde"; g.font = `24px ${serif}`; wrapText(g, d.verdict, pad, y+50, W-pad*2, 36);
  g.fillStyle = "#c9ab6a"; g.font = `14px ${sans}`; g.fillText("银行升职记", pad, H-30);

}
function wrapText(g, text, x, y, maxW, lh){
  let line = "", yy = y;
  for(const ch of String(text)){
    if(g.measureText(line + ch).width > maxW && line){ g.fillText(line, x, yy); line = ch; yy += lh; }
    else line += ch;
  }
  if(line) g.fillText(line, x, yy);
  return yy;
}

/* 给事件选项挂上成败:档位显示在选项上,点下去掷一次 */
function applyEventOdds(spec, key, data){
  if(!spec || !spec.opts) return spec;
  spec.opts = spec.opts.map((o, i) => {
    const E = EVENT_ODDS[key + ":" + i];
    if(!E || !o.fn || (E.when && !E.when())) return o;
    const orig = o.fn;
    let p; try { p = E.p(); } catch(e){ return o; }
    return Object.assign({}, o, {odds:p, fn:()=>{
      const ok = roll(p);
      if(E.rev){ if(ok) E.win(orig, data||{}); else orig(); }
      else { if(ok) orig(); else E.fail(orig, data||{}); }
    }});
  });
  return spec;
}
/* =====================================================================
   流程:任务队列、弹窗、回合管线
   ===================================================================== */
let JOBS = [], jobBusy = false;
function job(fn){ JOBS.push(fn); }
function runJobs(){
  if(jobBusy) return;
  while(JOBS.length){
    const f = JOBS.shift();
    let finished = false, sync = true;
    jobBusy = true;
    f(()=>{ finished = true; jobBusy = false; if(!sync) runJobs(); });
    sync = false;
    if(!finished) return;
  }
  if(!isHL() && typeof UI !== "undefined") UI.refresh();
}

let BOT = null;
function ask(spec, done){
  if(isHL()){
    const opts = spec.opts || [{t:"好"}];
    let i = BOT ? BOT.choose(spec) : 0;
    if(i == null || !opts[i] || opts[i].disabled) i = opts.findIndex(o=>!o.disabled);
    const o = opts[Math.max(0,i)];
    if(o && o.fn) o.fn();
    if(done) done();
    return;
  }
  UI.modal(spec, done);
}

/* ---------- 事件挑选 ---------- */
function evPool(){ return [null,EVENTS,EVENTS_L2,EVENTS_L3,EVENTS_L4,EVENTS_L5][S.lv] || []; }
function evDef(id){ return evPool().find(e=>e.id===id) || EVENTS.concat(EVENTS_L2,EVENTS_L3,EVENTS_L4,EVENTS_L5).find(e=>e.id===id); }
function eligible(e){
  if(e.once && S.evDone[e.id]) return false;
  if(e.cd && S.evLast[e.id] && S.turn - S.evLast[e.id] < e.cd) return false;
  try { return !!e.when(S); } catch(err){ return false; }
}
function pickEvents(){
  const b = BALANCE.story;
  const out = [];
  const has = id => out.some(x=>x.id===id);
  while(S.pendingEv.length) out.push(S.pendingEv.shift());
  S.sched = S.sched.filter(x => {
    if(x.lv && x.lv !== S.lv) return false;
    if(x.at > S.turn) return true;
    if(x.id === "rookie"){ addRookie(); return false; }
    out.push({id:x.id, data:x.data, later:true});
    return false;
  });
  evPool().filter(e => e.fixed && !has(e.id) && eligible(e)).forEach(e => out.push({id:e.id, data:e.pick?e.pick(S):null}));
  if(R() < b.randomP){
    const pool = evPool().filter(e => !e.fixed && !has(e.id) && eligible(e));
    if(pool.length){
      const tot = pool.reduce((a,e)=>a+(e.weight||1),0);
      let x = R()*tot;
      for(const e of pool){ x -= (e.weight||1); if(x<=0){ out.push({id:e.id, data:e.pick?e.pick(S):null}); break; } }
    }
  }
  if(S.lv===4 && S.biz.crisis && !S.biz.crisis.done && S.turn >= S.biz.crisis.at){
    if(!S.biz.crisis.kind) S.biz.crisis.kind = crisisKind();
    out.unshift({id:"crisis", data:null, later:true, crisis:true});
  }
  const show = out.slice(0, b.perTurn);
  S.pendingEv = out.slice(b.perTurn);
  show.forEach(x => { if(!x.later){ S.evDone[x.id] = true; S.evLast[x.id] = S.turn; } });
  return show;
}
function eventSpec(x){
  if(x.crisis || x.id==="crisis") return crisisEventSpec();
  if(x.later){
    const L = EVENTS_LATER[x.id];
    return applyEventOdds({kind:"event", id:x.id, title:L.title, body:L.body(S, x.data||{}), opts:L.opts(S, x.data||{})}, x.id, x.data);
  }
  const e = evDef(x.id);
  return applyEventOdds({kind:"event", id:x.id, title:e.title, body:e.body(S, x.data||{}), opts:e.opts(S, x.data||{})}, x.id, x.data);
}
function addRookie(){
  if(S.staff.length >= STAFF_L1.length) return;
  const base = S.staff.some(s=>s.id===ROOKIE_L1.id) ? Object.assign({}, ROOKIE_L1, {id:"rk"+S.turn, name:pick(["吴悠","马晓","孙一","钱朵"])}) : Object.assign({}, ROOKIE_L1);
  S.staff.push(Object.assign({off:0, trained:0}, base));
  S.people.push({id:base.id, name:base.name, role:ROLE_NAME[base.role], group:"部下", lvMet:S.lv, pos:"弹子石网点"+ROLE_NAME[base.role], fav:base.fav, note:base.note, met:true, recent:"", kind:"staff", alive:true});
  log("", `新人${base.name}到岗。${base.note}`);
}

/* ---------- 回合管线 ---------- */
function endTurn(){
  if(S.phase !== "play" || jobBusy || JOBS.length) return;
  job(d => { settleMonth(); S.report.ms = checkMilestones(true); d(); });
  job(d => ask(reportSpec(), d));
  job(d => { if(S.m === 12){ yearEnd(); ask(yearSpec(), d); } else d(); });
  job(d => { checkBreakthrough(); d(); });
  job(d => { if(S.m === 12) auditCheck(); d(); });
  job(d => { if(S.lv===5 && S.turn >= BALANCE.tenure[5]){ endGame(finalL5()); } d(); });
  job(d => { if(S.phase==="play" && S.turn >= S.promo.windowAt) runPromo(d); else d(); });
  job(d => offerSidestep(d));
  job(d => { if(S.phase === "play"){ if(S.justEntered){ S.justEntered = false; levelStartJobs(); } else advance(); } d(); });
  runJobs();
}
function offerSidestep(d){
  const key = "sideOffered" + S.lv;
  if(S.phase !== "play" || S.justEntered || S.promo.tries < 2 || S.flags[key]) return d();
  S.flags[key] = true;
  const T = SIDESTEP[S.lv];
  ask({kind:"event", title:T.title, body:T.body(S), opts:[
    {t:T.stay, s:"留在这里，等下一个窗口"},
    {t:T.go, s:"这一局到此为止", fn:()=>endGame("side")},
  ]}, d);
}
function levelStartJobs(){
  job(d => ask(kpiSpec(), d));
  if(S.lv === 2) job(d => decompAsk(d));
  if(S.lv === 5) job(d => eventChain(d));     // 总行第一回合:交接、战略会
  job(d => { computeCore(); save(); d(); });
}

function advance(){
  if(S.biz.timepoint){
    S.biz.timepoint = 0;
    log("warn", "十月一号早上九点，那三千万转走了。存款日报上，弹子石的数掉回原处。");
  }
  const step = BALANCE.turnMonths[S.lv] || 1;
  S.turn++; S.monthAbs += step;
  S.m += step;
  let newYear = false;
  if(S.m > 12){ S.m -= 12; S.year++; newYear = true; }
  syncAge();
  monthStart(false);
  if(newYear){ issueKpi(); stepRivals(true); }
  computeCore();
  if(S.lv < 5 && Math.random() < 0.6) log("group", pickLine([null,"group","groupL2","groupL3","groupL4"][S.lv]));
  if(S.lv===5 && S.turn+1 >= BALANCE.L5.cut.from && S.turn < BALANCE.tenure[5]) log("group", "【同业消息】央行下调贷款市场报价利率，各行息差再压一截。");
  if(newYear) job(d => ask(kpiSpec(), d));
  if(newYear && S.lv===2) job(d => decompAsk(d));
  job(d => { rumorCheck(d); });
  job(d => eventChain(d));
  job(d => { computeCore(); save(); d(); });
}
function eventChain(d){
  const evs = pickEvents();
  // 顺延到这回合的事件,条件可能已经不成立了(比如负责人换了),再查一遍;正文出错的也跳过
  let chain = evs.filter(x => { if(x.later || x.crisis) return true; const e = evDef(x.id); try { return !e.when || !!e.when(S); } catch(err){ return false; } })
    .map(x => (dd => { let sp; try { sp = eventSpec(x); } catch(err){ return dd(); } ask(sp, dd); }));
  const runChain = () => { const f = chain.shift(); if(!f){ d(); return; } f(runChain); };
  runChain();
}
function syncAge(){ const y = Math.floor(S.monthAbs/12); S.age = BALANCE.start.age + y; S.careerYear = BALANCE.start.careerYear + y; }
function pickLine(kind){ const a = LINES[kind]; return a[Math.floor(Math.random()*a.length)]; }

/* ---------- 弹窗内容 ---------- */
function reportSpec(){ return [null,reportSpecL1,reportSpecL2,reportSpecL3,reportSpecL4,reportSpecL5][S.lv](); }
function reportSpecL1(){
  const r = S.report;
  const arrow = r.rank < r.prevRank ? "↑" : (r.rank > r.prevRank ? "↓" : "→");
  const rows = [
    ["存款", fmtYi(r.dep), sgn(Math.round(r.dDep), v=>fmtWan(v))],
    ["中收", fmtWan(r.fee), ""],
    ["新增有效客户", r.cust+"户", ""],
    ["信用卡+代发", r.card+"户", ""],
    ["支行排名", `第${r.rank}名`, arrow],
  ];
  const notes = [];
  if(r.errors) notes.push(`柜面差错${r.errors}笔。`);
  if(r.lost > 0) notes.push(`到期没接住的客户转走了${fmtWan(r.lost)}。`);
  if(r.taskMissed) notes.push("支行的临时任务没办，黄世海在群里催了一次。");
  const quiet = !r.ms.length && !notes.length;
  return {kind:"report", title:`${S.m}月 · 月报`, rows, ms:r.ms, notes, quiet: quiet ? pickLine("quiet") : "",
    opts:[{t:S.m===12?"看年终考核":"下个月"}]};
}
function kpiSpec(){
  return {kind:"kpi", title:`入行第${S.careerYear}年 · 考核卡`,
    body:`${[null,"支行","分行","分行","总行","董事会"][S.lv]}把今年的考核卡发下来了。${S.year>1 && S.lv<5?(S.kpi.whipped===S.year?"去年你排第一，今年的目标比别人多压了一截。":"目标比去年上浮了一截。"):""}${S.year>1 && S.lv===5?"降息压着，目标没往上加。":""}`,
    items:S.kpi.card.map(it=>({name:it.name, w:it.w, target:it.target, unit:it.unit})),
    opts:[{t:"收到"}]};
}
/* 年底审计:干净度太低,每年有一定概率被查出来(不必等公示) */
function auditCheck(){
  const a = BALANCE.audit;
  if(S.phase !== "play" || S.lv >= 5 || S.core.clean >= a.line) return false;
  const p = Math.min(a.maxP, (a.line - S.core.clean) * a.k);
  if(R() >= p) return false;
  S.flags.audit = true;
  endGame("caught");
  return true;
}
function yearEnd(){
  const b = BALANCE["L"+S.lv];
  if(S.lv===2) yearEndL2();
  if(S.lv===3) yearEndL3();
  if(S.lv===4) yearEndL4();
  if(S.lv===5) yearEndL5();
  computeKpi(12);
  const final = S.kpi.card.map(it=>({name:it.name, done:it.done}));
  const rec = {year:S.year, careerYear:S.careerYear, age:S.age, score:S.kpi.score, rank:S.kpi.rank, items:final};
  S.kpi.history.push(rec);
  if(S.kpi.rank <= b.bonusTop){
    if(S.lv>=2) subordinates().forEach(p=>fav(p.id, b.bonusRep)); else allStaffFav(b.bonusRep);
    fav(supId(), b.bonusTrust);
    keyEvent(`入行第${S.careerYear}年综合考核${rankScope()}第${S.kpi.rank}`);
  }
  computeCore();
  S.lastYear = rec;
}
function rankScope(){ return [null,"全支行","全分行","二级分行中","全国一级分行中","同业"][S.lv]; }
function yearSpec(){ return S.lv===1 ? yearSpecL1() : (S.lv===2 ? yearSpecL2() : (S.lv===5 ? yearSpecL5() : yearSpecL34())); }
function yearSpecL1(){
  const r = S.lastYear;
  const good = r.rank <= B1().bonusTop;
  return {kind:"year", title:`入行第${r.careerYear}年 · 年终考核`, rec:r,
    body: good ? `年终考核弹子石排第${r.rank}。评优的名单贴在支行一楼，你的名字在第二行。年终奖比去年多了一截，员工们的也是。`
               : `年终考核弹子石排第${r.rank}。${r.rank>=6?"黄世海在总结会上念了排名，念到弹子石停了一下。":"不上不下。年终奖发了，和去年差不多。"}`,
    opts:[{t:"翻篇"}]};
}

/* ---------- 升职窗口 ---------- */
function rumorLead(){
  const p = BALANCE.promo;
  return p.rumorLead[S.lv] + (S.core.trust >= p.trustEarly ? 1 : 0);
}
function rumorCheck(d){
  if(S.lv >= 5 || S.promo.rumored || S.phase!=="play") return d();
  if(S.turn < S.promo.windowAt - rumorLead() + 1) return d();
  S.promo.rumored = true;
  const T = PROMO_TEXT[S.lv];
  const lines = [T.rumorBase];
  const lu = person("lu"), gu = person("gu");
  let patron;
  if(lu.met && lu.fav >= 50) patron = T.rumorPatron.lu;
  else if(gu.met && gu.fav >= 50) patron = T.rumorPatron.gu;
  else patron = (T.rumorPatron.sup || T.rumorPatron.huang).replace("${sur}", S.player.sur);
  lines.push(patron);
  log("group", T.rumorGroup);
  log("gold", T.rumorLog);
  const left = S.promo.windowAt - S.turn + 1;
  ask({kind:"promo", title:"风声", body: lines.join("\n\n") + `\n\n离组织考察还有${left}个月。`, opts:[{t:"晓得了"}]}, d);
}
function checkBreakthrough(){
  const p = BALANCE.promo, bt = p.bt;
  if(S.promo.bt || S.lv > 4) return;
  const ok = (S.biz.rankStreak||0) >= bt.streak && ["perf","rep","trust","clean"].every(k=>S.core[k] >= bt.coreMin);
  if(!ok) return;
  const earliest = BALANCE.tenure[S.lv] - bt.cut[S.lv];
  const at = Math.max(earliest, S.turn + rumorLead());
  if(at < S.promo.windowAt){
    S.promo.windowAt = at; S.promo.bt = true; S.promo.rumored = false;
    S.track.btLv = (S.track.btLv||[]).concat([S.lv]);
    log("gold", S.lv>=3 ? "有人在会上提了你的名字，说可以破格用。" : S.lv===2 ? "分行党委会上有人提了南岸，说这个支行行长可以破格用。" : "有人在分行的会上提了弹子石的名字，说这个网点负责人可以破格用。");
    keyEvent("被提名破格提拔");
  }
}

/* ---------- 组织考察 ---------- */
function promoVotes(){
  const p = BALANCE.promo.vote, T = PROMO_TEXT[S.lv];
  const voters = S.lv>=2 ? subordinates().slice(0,10).map(p => ({name:p.name, role:p.pos, fav:p.fav})) : S.staff.map(s => ({name:s.name, role:ROLE_NAME[s.role], fav:s.fav}));
  T.voters.forEach(v => voters.push({name:v.name, role:v.role, fav: v.src==="trust" ? S.core.trust : S.core.rep}));
  voters.forEach(v => {
    const pg = clamp((v.fav - p.goodFrom)/p.goodSpan, 0, 1);
    const pb = clamp((p.badFrom - v.fav)/p.badSpan, 0, 1);
    const x = R();
    v.vote = x < pg ? "good" : (x < pg + pb ? "bad" : "ok");
  });
  const score = voters.reduce((a,v)=>a + (v.vote==="good"?p.good:(v.vote==="ok"?p.ok:p.bad)), 0) / voters.length;
  return {voters, score: Math.round(score)};
}
function promoStatements(){
  const p = BALANCE.promo;
  const list = [];
  (MILESTONES[S.lv]||[]).forEach(ms => { if(S.milestones[ms.id]) list.push({txt:ms.stmt, v:p.stmtMilestone}); });
  const best = S.kpi.history.slice().sort((a,b)=>a.rank-b.rank)[0];
  if(best && best.rank <= 3) list.push({txt:`入行第${best.careerYear}年综合考核${rankScope()}第${best.rank}名`, v: Math.max(40, p.stmtRankTop - p.stmtRankStep*(best.rank-1))});
  const src = S.kpi.history.length ? S.kpi.history[S.kpi.history.length-1].items : S.kpi.card.map(it=>({name:it.name, done:it.done}));
  src.forEach(it => { if(it.done >= 1) list.push({txt:`${it.name}完成${Math.round(it.done*100)}%`, v: Math.min(p.stmtKpiMax, Math.round(p.stmtKpiBase + (it.done-1)*p.stmtKpiK))}); });
  if(S.lv===1 && S.flags.exposedHuang) list.push({txt:"贷后检查如实反映问题", v:78});
  if(S.lv===2 && S.flags.reportedMaben) list.push({txt:"及时向分行报告同业风险", v:74});
  if(S.lv===4 && S.flags.crisisGood) list.push({txt:"妥善处置重大风险事件", v:86});
  PROMO_TEXT[S.lv].fillers.forEach(f => {
    let v = f.v;
    if(v === "staff") v = Math.round(45 + S.staff.reduce((a,s)=>a+s.op+s.mk,0)/S.staff.length*2.5);
    if(v === "comp") v = S.kpi.comp >= 90 ? 70 : 45;
    if(v === "mgrs") v = Math.round(40 + subsL2().reduce((a,p)=>a+(p.skill||50),0)/Math.max(1,subsL2().length)*0.5);
    if(v === "npl") v = nplRatio() <= 1.2 ? 72 : 45;
    if(v === "outlets") v = (S.biz.opened||0) > 0 ? 70 : 52;
    if(v === "npl3") v = nplL3()/loansTotalL3()*100 < 1.8 ? 76 : 48;
    if(v === "unity") v = Math.round(40 + S.biz.unity*0.45);
    if(v === "rating") v = ratingNow() <= 2 ? 78 : 50;
    list.push({txt:f.txt, v});
  });
  return list;
}
function talkValue(o){
  if(o.v === "cleanCheck") return S.core.clean >= 85 ? 80 : 50;
  if(o.v === "payrollCheck") return S.biz.prospects && S.biz.prospects.some(x=>x.won) ? 86 : 70;
  if(o.huang) return o.v + (person("huang").fav >= 70 ? 8 : 0);
  if(o.v === "loanCheck") return (S.loanBook||[]).filter(l=>l.lv===2 && l.tier==="high").length <= 1 ? 84 : 48;
  if(o.v === "mabenCheck") return S.flags.mabenFall ? 80 : 45;
  if(o.v === "nplCheck") return nplL3()/loansTotalL3()*100 > 1.8 ? 78 : 58;
  if(o.v === "platformCheck") return S.loanBook.some(l=>l.src==="platform") ? 52 : 66;
  if(o.v === "crisisCheck") return S.flags.crisisGood ? 80 : 60;
  if(o.v === "familyCheck") return (S.flags.family||0) > 0 ? 76 : 60;
  return o.v;
}
function promoRivals(){
  const p = BALANCE.promo;
  let pool = S.rivals.filter(r => r.boss !== "——");
  if(S.lv===2 && S.flags.reportedMaben) pool = pool.filter(r => r.id !== "yubei");
  let top = pool.slice().sort((a,b)=>b.score-a.score).slice(0, p.rivals);
  if(S.lv===2 && !top.some(r=>r.id==="yubei")){ const mb = pool.find(r=>r.id==="yubei"); if(mb) top = top.slice(0, p.rivals-1).concat([mb]); }
  return top.map(r => {
    let sc = (p.rivalBaseLv[S.lv]||p.rivalBase) + (r.score-85)*p.rivalK + gauss()*p.rivalNoise + S.promo.tries*p.retryPenalty;
    if(r.id==="yubei" && S.flags.mabenHelped) sc += 5;
    // 封顶以后再抖一下:对手最高分落在一个带子里,不是一条死线
    const capped = clamp(sc, p.rivalMin, (p.rivalMaxLv&&p.rivalMaxLv[S.lv])||p.rivalMax) + gauss()*(p.rivalTopNoise||0);
    return {name:r.boss, from:r.name, score: Math.round(capped)};
  });
}
function promoFinal(votes, stmtIdx, answers){
  const p = BALANCE.promo, w = p.w;
  const stmts = promoStatements();
  const chosen = stmtIdx.map(i=>stmts[i]).filter(Boolean);
  while(chosen.length < p.stmtPick) chosen.push({txt:"——", v:p.stmtFiller-15});
  const stmtScore = chosen.reduce((a,x)=>a+x.v,0)/chosen.length;
  const qs = PROMO_TEXT[S.lv].talk;
  const talkScore = qs.reduce((a,q,i)=>a + talkValue(q.opts[answers[i]] || q.opts[q.opts.length-1]), 0)/qs.length;
  const talk = Math.round((stmtScore + talkScore)/2);
  qs.forEach((q,i)=>{ const o = q.opts[answers[i]]; if(o && o.huang) fav("huang",3); });
  const mine = {perf:S.core.perf, vote:votes.score, trust:S.core.trust, talk};
  // L3 起组织考察看廉洁:干净度高于基准加分,低于扣分
  const cb = p.cleanBonus && p.cleanBonus[S.lv] ? (S.core.clean - p.cleanBonus.from) * p.cleanBonus[S.lv] : 0;
  mine.clean = Math.round(cb*10)/10;
  mine.total = Math.round(mine.perf*w.perf + mine.vote*w.vote + mine.trust*w.trust + mine.talk*w.talk + cb + gauss()*(p.selfNoise||0));
  const rivals = promoRivals();
  S.promo.backed = null;
  if(R() < (p.backP||0)){ const top = rivals.slice().sort((a,b)=>b.score-a.score)[0]; top.score += p.backBonus; S.promo.backed = top.name; }
  const best = rivals.slice().sort((a,b)=>b.score-a.score)[0];
  const win = mine.total >= p.pass && mine.total > best.score;
  const res = {mine, rivals, win, best, chosen};
  S.promo.last = {turn:S.turn, total:mine.total, win, best:best.score, lv:S.lv};
  (S.track.promoLog = S.track.promoLog || []).push({lv:S.lv, turn:S.turn, total:mine.total, best:best.score, win});
  return res;
}
function promoPublicity(){
  const p = BALANCE.promo.report;
  const prob = Math.max(0, (p.from - S.core.clean) * p.k);
  const out = {prob, reported:false, result:"pass"};
  if(R() < prob){
    out.reported = true;
    const gu = person("gu");
    if(gu.met && gu.fav >= p.guShield && !S.flags.guShieldUsed){ S.flags.guShieldUsed = true; out.result = "shield"; }
    else if(S.core.clean >= p.deferMin) out.result = "defer";
    else out.result = "caught";
  }
  return out;
}
function promoLose(kind){
  const p = BALANCE.promo;
  S.promo.tries++;
  S.promo.rumored = false;
  S.promo.windowAt = S.turn + (kind==="defer" ? p.deferGap[S.lv] : p.retryGap[S.lv]);
  // 年龄线:下一个窗口时的年龄 + 过渡年数 超过下一级年龄线 → 锁定
  const ageAtWindow = S.age + Math.floor((S.m - 1 + (S.promo.windowAt - S.turn) * (BALANCE.turnMonths[S.lv]||1)) / 12);
  if(ageAtWindow + BALANCE.transYears[S.lv] > BALANCE.ageLine[S.lv+1]){
    endGame("lock");
    return;
  }
  log("bad", kind==="defer" ? "任命暂缓。下一个窗口，还要等。" : "这一回没选上。下一个窗口，要等一年。");

function runPromo(done){

  S.promo.stage = "assess";
  save();
  if(!isHL()){ UI.promoFlow(done); return; }
  const votes = promoVotes();
  const stmts = promoStatements();
  const pickIdx = BOT && BOT.stmt ? BOT.stmt(stmts) : stmts.map((x,i)=>[x.v,i]).sort((a,b)=>b[0]-a[0]).slice(0,3).map(x=>x[1]);

  const res = promoFinal(votes, pickIdx, answers);
  S.promo.stage = null;

  const pub = promoPublicity();

  if(pub.result === "caught"){ endGame("caught"); return done(); }
  if(pub.result === "defer"){ S.phase = "play"; promoLose("defer"); return done(); }
  applyAppoint();
  applyTransition();
  done();
}

function botChooseGeneric(mode){
  return function(spec){
    const opts = (spec.opts||[]).map((o,i)=>Object.assign({i}, o)).filter(o=>!o.disabled);
    if(!opts.length) return 0;
    const clean = opts.filter(o=>!o.gray), gray = opts.filter(o=>o.gray);
    if(mode==="random") return opts[Math.floor(R()*opts.length)].i;
    if(mode==="greedy") return (gray[0]||opts[0]).i;
    if(mode==="clean") return (clean[0]||opts[0]).i;
    // balanced
    if(gray.length && R() < 0.15) return gray[0].i;
    const pool = clean.length ? clean : opts;
    return (R() < 0.5 ? pool[0] : pool[Math.floor(R()*pool.length)]).i;
  };
}

/* 高手:会读卡、会算账的人。L1 按期望收益挑客户和产品,后面几关按 balanced 打 */
function botExpertL1(){
  // 一步前瞻:每个行动点把候选行动在副本上试一遍(按成功算),结算当月看综合得分,乘成功率取最好的
  const b = B1(); let g = 6;
  const o = BALANCE.odds, keep = [o.min, o.max];
  while(S.ap > 0 && S.phase==="play" && g-- > 0){
    const cands = [];
    if(canAct("boss").ok) cands.push({p:ODDS[1].boss(), f:()=>doBoss()});
    if(canAct("hall").ok) cands.push({p:ODDS[1].hall(), f:()=>doHall()});
    if(canAct("rally").ok) cands.push({p:ODDS[1].rally(), f:()=>doRally()});
    cands.push({p:ODDS[1].out(), f:()=>doOut("community")}, {p:ODDS[1].out(), f:()=>doOut("street")});
    const pc = b.out.payroll, cm = staffByRole("cm")[0];
    S.biz.prospects.filter(x=>!x.won).forEach(x => { if(S.biz.budget >= pc.cost) cands.push({p:pc.baseP + (cm?cm.mk:3)*pc.mkP + x.tries*pc.tryP, f:()=>doOut("payroll", x.id), payroll:true}); });
    S.staff.forEach(st => ["mk","op","cp"].forEach(at => { if(st[at] < b.train.max) cands.push({p:ODDS[1].train(st), f:()=>doTrain(st.id, at), train:true}); }));
    S.biz.cards.filter(c=>!c.maint).sort((x,y)=>(y.other + (y.due===S.m?y.own:0)) - (x.other + (x.due===S.m?x.own:0))).slice(0,10)
      .forEach(c => PRODUCTS.forEach(pd => { if(pd.id==="fund" && c.risk < b.product.fund.riskLevel) return; cands.push({p:ODDS[1].maintain(c, pd.id), f:()=>doMaintain(c.id, pd.id)}); }));
    const snap = JSON.stringify(S), base = (()=>{ S = JSON.parse(snap); settleMonth(); const v = S.kpi.score; S = JSON.parse(snap); return v; })();
    let best = null;
    o.min = o.max = 1;
    cands.forEach(cd => {
      S = JSON.parse(snap);
      try { cd.f(); settleMonth(); } catch(e){ S = JSON.parse(snap); return; }
      // 带教和代发的好处在以后,当月看不出来,给一点远期分
      const later = cd.train ? 0.6 : (cd.payroll ? 1.5 : 0);
      const ev = clamp(cd.p, keep[0], keep[1]) * (S.kpi.score - base + later);
      if(!best || ev > best.ev) best = {cd, ev};
    });
    [o.min, o.max] = keep;
    S = JSON.parse(snap);
    if(!best) break;
    best.cd.f();
  }
}
function botPlay(mode){
  if(mode === "expert"){ if(S.lv === 1) return botExpertL1(); mode = "balanced"; }
  if(S.lv === 2) return botPlayL2(mode);
  if(S.lv === 3) return botPlayL3(mode);
  if(S.lv === 4) return botPlayL4(mode);
  if(S.lv === 5) return botPlayL5(mode);
  const trainP = mode==="mentor" ? 0.85 : (mode==="grind" ? 0 : 0.35);
  const orig = mode;
  if(mode==="mentor" || mode==="grind") mode = "balanced";

    doTrain(s.id, attr);
  }
  if(orig==="grind" && canAct("rally").ok && S.staff.every(s=>s.fatigue<40)) doRally();
  let guard = 12;
  while(S.ap > 0 && S.phase==="play" && guard-- > 0){

      continue;

    const due = dueCards();

    // 1 临时任务
    if(S.biz.task && !S.biz.taskDone && canAct("boss").ok && (mode!=="random")){ doBoss(); continue; }
    // 2 greedy 开晨会
    if(mode==="greedy" && canAct("rally").ok && S.staff.every(s=>s.fatigue<45)){ doRally(); continue; }
    // 3 到期客户
    if(due.length && due[0].own > 60){

      else if(c.risk >= 4) prod = "fund";

    }
    // 4 代发
    const pp = S.biz.prospects.filter(p=>!p.won).sort((a,b)=>b.tries-a.tries)[0];
    if(pp && S.biz.budget >= b.out.payroll.cost + (S.biz.budget>=b.hall.cost+b.out.payroll.cost?0:0) && R()<0.5){ doOut("payroll", pp.id); continue; }
    // 5 厅堂
    if(canAct("hall").ok){ doHall(); continue; }
    // 6 带教(薄弱项)
    if(mode!=="greedy" && R()<trainP){
      const s = S.staff.slice().sort((a,b)=>(a.mk+a.op+a.cp)-(b.mk+b.op+b.cp))[0];
      const attr = s.role==="teller" ? (s.op<=s.cp?"op":"cp") : "mk";
      if(s && doTrain(s.id, attr)) continue;

    const pc = potCards()[0];
    if(pc && pc.other > 250 && R()<0.6){ doMaintain(pc.id, mode==="greedy"?"fund":(pc.risk>=4?"fund":"stable")); continue; }

/* ---------- L2 机器人 ---------- */
function loanVisibleScore(it){ const ts = B2().tierScore; return ts.coll[it.coll] + ts.flow[it.flow] + ts.tax[it.tax]; }
function botPlayL2(mode){
  const b = B2();
  const steady = mode==="steady"; if(steady) mode = "balanced";   // steady:不督导、不换人,只看委托本身
  // 1 审批队列
  S.biz.queue.slice().forEach(it => {
    const v = loanVisibleScore(it);
    let ok;
    if(mode==="random") ok = R() < 0.5;
    else if(mode==="greedy") ok = true;
    else if(mode==="clean") ok = v <= 0.5 && !it.rel;
    else ok = v <= 0.5 || (it.rel && v <= 1);
    decideLoan(it.id, ok);
  });
  let guard = 10;
  while(S.ap > 0 && S.phase==="play" && guard-- > 0){
    const ids = ACTIONS_L2.map(a=>a.id).filter(id=>canActL2(id).ok);
    if(!ids.length) break;
    if(mode==="random"){
      const id = pick(ids), ap = activeProjects();
      if(id==="supervise") doSupervise(pick(S.biz.outlets).id);
      else if(id==="push" && ap.length) doPush(pick(ap).id);
      else if(id==="visit" && ap.length) doVisit(pick(ap).id, R()<0.5 && S.biz.budget>=b.project.giftCost);
      else if(id==="campaign") doCampaign();
      else if(id==="appoint"){ const o = pick(S.biz.outlets), c = appointCands(o.id); if(c.length) doAppoint(o.id, pick(c).id); else doReportUp() || doSupervise(o.id); }
      else doReportUp() || doSupervise(pick(S.biz.outlets).id);
      continue;
    }
    // 空缺的网点先补人
    const empty = S.biz.outlets.find(o=>!o.mgr);
    if(!steady && empty && canActL2("appoint").ok){ const c = appointCands(empty.id).sort((a,b)=>b.skill-a.skill)[0]; if(c){ doAppoint(empty.id, c.id); continue; } }
    // 能力差太多的负责人换掉
    if(mode!=="greedy" && !steady){
      const weak = S.biz.outlets.filter(o=>o.mgr).sort((a,b)=>skillOf(a.mgr)-skillOf(b.mgr))[0];
      const c = weak ? appointCands(weak.id).sort((a,b)=>b.skill-a.skill)[0] : null;
      if(c && c.skill > skillOf(weak.mgr) + 20){ doAppoint(weak.id, c.id); continue; }
    }
    const ap = activeProjects().sort((a,b)=>b.stage-a.stage || b.prog-a.prog);
    const inAppr = ap.find(p=>p.stage===2);
    if(inAppr){
      const d = PROJ_L2.find(x=>x.id===inAppr.id);
      if(inAppr.visits + inAppr.gift < (d.tier==="low"?0:1) && canActL2("visit").ok){ doVisit(inAppr.id, mode==="greedy" && S.biz.budget>=b.project.giftCost); continue; }
      doPush(inAppr.id); continue;
    }
    if(canActL2("campaign").ok && S.biz.budget >= b.campaign.cost + (mode==="greedy"?0:6)){ doCampaign(); continue; }
    if(ap.length && R() < 0.6){ doPush(ap[0].id); continue; }
    if(!S.biz.reported && person("zhouqm").fav < 65){ doReportUp(); continue; }
    const o = S.biz.outlets.filter(x=>!x.supervised).sort((a,c)=>(a.morale-c.morale))[0];
    if(o && !steady){ doSupervise(o.id); continue; }
    if(ap.length){ doPush(ap[0].id); continue; }
    break;
  }
}
/* ---------- L3 机器人 ---------- */
function botPlayL3(mode){
  const b = B3();
  const steady = mode==="steady"; if(steady || mode==="mentor" || mode==="grind") mode = "balanced";
  // 不良处置
  let guard = 6;
  while(S.biz.disposedQ < disposeCap() && guard-- > 0){
    const x = S.biz.npa.filter(n=>!n.stage).sort((a,c)=>c.amt-a.amt)[0]; if(!x) break;
    let how = "collect";
    if(mode==="random") how = pick(["collect","sue","restr","writeoff"]);
    else if(mode==="greedy") how = "restr";
    else if(S.biz.writeoffUsed + x.amt <= b.dispose.writeoff.quotaY && x.amt > 6000) how = "writeoff";
    else if(x.amt > 5000) how = "sue";

  }
  let g2 = 8;
  while(S.ap > 0 && S.phase==="play" && g2-- > 0){
    const ids = ACTIONS_L3.map(a=>a.id).filter(id=>canActL3(id).ok);
    if(!ids.length) break;
    if(mode==="random"){
      const id = pick(ids);
      if(id==="open") doOpenOutlet(pick(S.biz.areas).id);
      else if(id==="close") doCloseOutlet(pick(S.biz.branches.filter(x=>x.outlets>1)).id);

      else if(id==="tilt") doTilt(pick(LINES_L3).id) || doReportUpL3();
      else if(id==="appoint"){ const x = pick(S.biz.branches), c = appointCandsL3(x.id); if(c.length) doAppointL3(x.id, pick(c).id); else doReportUpL3() || apUse(1); }
      else if(id==="platform"){ doPlatform(); decidePlatform(R()<0.5); }

    if(!S.biz.tilt || (S.biz.tilt!=="risk" && nplL3()/loansTotalL3()*100 > 2.2)){ doTilt(nplL3()/loansTotalL3()*100 > 2.0 ? "risk" : "retail"); continue; }
    if(!steady){
      const weak = S.biz.branches.slice().sort((a,c)=>skillOf(a.mgr)-skillOf(c.mgr))[0];
      const c = appointCandsL3(weak.id).sort((a,d)=>d.skill-a.skill)[0];
      if(c && c.skill > skillOf(weak.mgr) + 15 && canActL3("appoint").ok){ doAppointL3(weak.id, c.id); continue; }
    }
    if(canActL3("platform").ok && S.turn >= 3 && ((mode==="greedy") || (mode==="balanced" && R()<0.05))){ doPlatform(); decidePlatform(mode!=="clean"); continue; }
    if(canActL3("open").ok && S.biz.newOutlets.length < 3){ const a = S.biz.areas.slice().sort((x,y)=>(y.heat-y.comp*0.5)-(x.heat-x.comp*0.5))[0]; doOpenOutlet(a.id); continue; }
    if(!S.biz.reported && person("lu").fav < 65){ doReportUpL3(); continue; }
    if(canActL3("renovate").ok){ const x = S.biz.branches.filter(y=>y.renov<0.3).sort((a,c)=>c.dep-a.dep)[0]; if(x && doRenovate(x.id)) continue; }
    if(!S.biz.reported){ doReportUpL3(); continue; }
    break;
  }
}
/* ---------- L4 机器人 ---------- */
function bestAssignGain(){
  let best = null;
  S.biz.deputies.forEach(x => S.biz.deputies.forEach(y => { if(x===y) return;
    const g = (x.fit[y.line] + y.fit[x.line]) - (x.fit[x.line] + y.fit[y.line]);
    if(g > 0 && (!best || g > best.g)) best = {a:x.id, b:y.id, g}; }));
  return best;
}
function botPlayL4(mode){
  if(mode==="steady" || mode==="mentor" || mode==="grind") mode = "balanced";
  let g = 8;
  while(S.ap > 0 && S.phase==="play" && g-- > 0){
    const ids = ACTIONS_L4.map(a=>a.id).filter(id=>canActL4(id).ok);
    if(!ids.length) break;
    if(mode==="random"){
      const id = pick(ids), ds = S.biz.deputies;
      if(id==="swap"){ const a = pick(ds), c = pick(ds.filter(x=>x!==a)); doSwap(a.id, c.id); }
      else if(id==="talk") doTalk(pick(ds).id);
      else if(id==="startp") doStartProj() || doRegulator();
      else if(id==="pushp") doPushProj(S.biz.projects.find(p=>!p.done).id);
      else if(id==="focus") doFocus(pick(S.biz.inst).id);
      else if(id==="quota") doQuota();
      else doRegulator();
      continue;
    }
    const gain = bestAssignGain();
    if(gain && gain.g >= 10 && S.biz.unity > 45){ doSwap(gain.a, gain.b); continue; }
    if(capRoom() < 150000){ doQuota(); continue; }
    if(canActL4("startp").ok){ const r = doStartProj(); if(r === true) continue; }
    const low = S.biz.deputies.map(d=>person(d.id)).sort((a,c)=>a.fav-c.fav)[0];
    if(S.biz.unity < 55 && low){ doTalk(low.id); continue; }
    if(person("gu").fav < 60 && mode!=="greedy"){ doRegulator(); continue; }
    if(!S.biz.focusId){ const x = S.biz.inst.slice().sort((a,c)=>c.dep-a.dep)[1]; doFocus(x.id); continue; }
    const p = S.biz.projects.find(x=>!x.done);
    if(p){ doPushProj(p.id); continue; }
    if(low){ doTalk(low.id); continue; }
    break;
  }
}
function botDecomp(mode){
  return () => {
    const f = decompFair();
    if(mode==="random"){ const e = Math.round(f.total/4/f.step)*f.step; const arr=[e,e,e,e]; arr[0]+=f.total-e*4; return arr; }
    if(mode==="greedy"){ const arr = decompProportional(); const mv = 2*f.step*3; arr[0]+=mv; arr[1]-=mv; return arr; }
    return decompProportional();
  };
}

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const paras = s => String(s).split(/\n\n+/).map(p=>`<p>${p.replace(/\n/g,"<br>")}</p>`).join("");

const UI = {
  tab: "colM",
  custTab: "due",
  rolls: {},
  snapL1: null,

  /* ---------- 渲染 ---------- */
  refresh(){
    if(!S) return;
    if(S.phase === "over"){ UI.showEnding(); return; }
    $("app").classList.remove("hidden");
    UI.renderTop(); UI.renderLeft(); UI.renderMid(); UI.renderLog();
    const th = $("top").getBoundingClientRect().height;
    document.documentElement.style.setProperty("--toph", th + "px");
  },
  renderTop(){
    const c = S.core, cw = BALANCE.core.cleanWarn;
    const apDots = Array.from({length:S.apMax}, (_,i)=>`<i class="${i<S.ap?"on":""}"></i>`).join("");
    const turnTxt = S.lv<=2 ? `${S.m}月 · 第${S.turn}回合` : (S.lv<=4 ? `${qName()} · 第${S.turn}回合` : `${S.m<=6?"上半年":"下半年"} · 第${S.turn}回合`);
    $("top").innerHTML = `
      <div class="who">${esc(titleOf(S))}</div>
      <div class="meta">${S.age}岁 · 入行第${S.careerYear}年 · ${turnTxt}</div>
      ${S.phase==="play" ? `<div class="ap" title="行动点">${apDots}</div>` : ""}
      ${S.promo.rumored && S.phase==="play" ? `<div class="win-badge" title="升职窗口">窗口 · ${Math.max(0,S.promo.windowAt - S.turn)}月后考察</div>` : ""}
      <div class="cores">
        <div class="core"><b class="num" data-roll="perf">${c.perf}</b><span>业绩</span></div>
        <div class="core"><b class="num" data-roll="rep">${c.rep}</b><span>口碑</span></div>
        <div class="core"><b class="num" data-roll="trust">${c.trust}</b><span>上级信任</span></div>
        ${c.clean <= cw ? `<div class="clean-ico" title="有些事，经不起翻">🗂</div>` : ""}
        <button class="topbtn" id="btnPeople">人脉簿</button>
        <button class="topbtn" id="btnMenu">菜单</button>
      </div>`;
    $("btnPeople").onclick = UI.showPeople;
    $("btnMenu").onclick = UI.showMenu;
    UI.rollAll();
  },
  renderLeft(){
    const cap = BALANCE.kpiCap;
    const items = S.kpi.card.map(it => {
      const pct = clamp(it.done/cap, 0, 1)*100;
      const pace = it.kind==="flow" ? clamp((S.m/12)/cap, 0, 1)*100 : clamp(1/cap,0,1)*100;
      if(it.kind==="lower") it.done = it.pace;
      const cls = it.pace >= 1 ? "ok" : (it.pace < 0.85 ? "lo" : "");
      const big = v => S.lv===5 ? (v/10000).toFixed(0)+"亿" : S.lv>=3 ? (Math.abs(v)>=1000000 ? fmtYi0(v) : fmtYi1(v)) : fmtWan(v);
      const lowerPct = it.k==="npl";
      const act = it.unit==="万" ? big(it.actual) : (it.unit==="%" ? Number(it.actual).toFixed(lowerPct?2:1)+"%" : (it.unit==="亿/网点" ? Number(it.actual).toFixed(1)+"亿" : Math.round(it.actual)+it.unit));
      const tgt = it.unit==="万" ? big(it.target) : (it.unit==="%" ? (lowerPct?"≤":"≥")+it.target+"%" : (it.unit==="亿/网点" ? "≥"+it.target+"亿" : (it.k==="rating" ? "≤"+it.target+"级" : (it.k==="rank" ? "前"+it.target+"名" : it.target+it.unit))));
      return `<div class="kpi-it"><div class="l"><span>${it.name} <small>${it.w}</small></span><span class="num">${act} <small>/ ${tgt}</small></span></div>
        <div class="bar"><i class="${cls}" style="width:${pct}%"></i><span class="pace" style="left:${pace}%"></span></div></div>`;
    }).join("");
    const first = !S.track.scoreHistory.length;
    let t = S.kpi.table || [];
    if(first && S.lv<=2) t = t.filter(r=>!r.me).concat([{name:S.lv===2?"南岸支行":"弹子石网点", boss:S.player.sur+S.player.given, score:null, me:true}]);
    const rows = t.map((r,i) => {
      let arr = "";
      if(r.me && S.kpi.prevRank){ const d = S.kpi.prevRank - S.kpi.rank; arr = d>0?`<span class="arr-up">↑${d}</span>`:(d<0?`<span class="arr-dn">↓${-d}</span>`:""); }
      return `<tr class="${r.me?"me":""}"><td class="n">${i+1}</td><td>${r.name}<br><small class="muted">${r.boss}</small></td><td class="s num">${r.score==null?"—":(S.lv===5?fmtWy(r.score):r.score.toFixed(1))} ${first?"":arr}</td></tr>`;
    }).join("");
    $("colL").innerHTML = `
      <div class="box"><h3>考核卡 <em>入行第${S.careerYear}年</em></h3>${items}
        <div class="score"><span class="muted">综合得分</span><b class="num" data-roll="score">${S.track.scoreHistory.length?S.kpi.score.toFixed(1):"—"}</b></div>
        <p class="hint" style="margin-top:6px">金线是时序进度。完成率封顶${Math.round(cap*100)}%。</p></div>
      <div class="box"><h3>${[null,"支行","分行","二级分行","全国一级分行","同业规模"][S.lv]}排名 <em>${first?(S.lv===5?"半年后出排名":"月底出排名"):"第"+S.kpi.rank+"名"}</em></h3><table class="rank-t">${rows}</table></div>`;
    UI.rollAll();
  },
  renderMid(){
    if(S.lv === 2){ UI.renderL2(); return; }
    if(S.lv === 3){ UI.renderL3(); return; }
    if(S.lv === 4){ UI.renderL4(); return; }
    if(S.lv === 5){ UI.renderL5(); return; }
    const b = B1();
    const dep = depTotal(), dd = dep - S.month.dep0;
    const tk = S.biz.task;
    const acts = ACTIONS_L1.map(a => {
      const ck = canAct(a.id);
      return `<button class="act" data-act="${a.id}" ${ck.ok?"":"disabled"} title="${esc(ck.ok?a.desc:ck.why)}"><b>${a.name}${oddsChip(actOdds(a.id))}</b><small>${a.desc}</small></button>`;
    }).join("");
    $("colM").innerHTML = `
      <div class="box">
        <h3>弹子石网点 <em>${S.staff.length}人 · 一个厅</em></h3>
        <div class="stats">
          <div class="stat"><span>存款</span><b class="num" data-roll="dep">${fmtYi(dep)}</b></div>
          <div class="stat"><span>本月增量</span><b class="num" style="color:${dd>=0?"var(--good)":"var(--bad)"}">${sgn(Math.round(dd), fmtWan)}</b></div>
          <div class="stat"><span>营销费用</span><b class="num">${r1(S.biz.budget)}万</b></div>
          <div class="stat"><span>满意度</span><b class="num">${Math.round(S.biz.csat)}</b></div>
          <div class="stat"><span>合规</span><b class="num">${Math.round(S.kpi.comp)}</b></div>
        </div>
        ${tk ? `<div class="task ${S.biz.taskDone?"done":""}">支行临时任务：${esc(tk)}${S.biz.taskDone?"（已办）":""}</div>` : ""}
      </div>
      <div class="box"><h3>本月行动 <em>剩 ${S.ap} 点</em></h3><div class="acts">${acts}</div>
        <div class="endbar"><span class="muted" style="font-size:12px">${S.ap?"行动点没用完也可以结束":""}</span><button class="btn" id="btnEnd">结束本月</button></div></div>
      <div class="box" id="custBox">${UI.custHtml()}</div>
      <div class="box"><h3>员工 <em>岗位可以随时调</em></h3><div class="staffs">${UI.staffHtml()}</div></div>`;
    $("colM").querySelectorAll("[data-act]").forEach(el => el.onclick = () => UI.onAct(el.dataset.act));
    $("btnEnd").onclick = () => { endTurn(); UI.refresh(); };
    UI.bindCust(); UI.bindStaff();
    UI.rollAll();
  },
  custList(){
    const cs = S.biz.cards;
    if(UI.custTab === "due") return cs.filter(c=>c.due===S.m).sort((a,b)=>b.own-a.own);
    if(UI.custTab === "pot") return cs.slice().sort((a,b)=>b.other-a.other).slice(0,12);
    if(UI.custTab === "cmp") return cs.filter(c=>c.complain && S.turn - c.complain <= 6);
    return cs.slice().sort((a,b)=>b.own-a.own);
  },
  custHtml(){
    const tabs = [["due","本月到期"],["pot","高潜力"],["cmp","近期投诉"],["all","全部"]];
    const list = UI.custList();
    const cards = list.map(c => {
      const due = c.due === S.m;
      return `<button class="cc ${due?"due":""} ${c.maint?"done":""}" data-card="${c.id}">
        <span class="rk ${c.risk<=2?"":"hi"}">R${c.risk}</span>
        <b>${c.name}</b> <span class="muted">${CUST_TYPES[c.type].name}</span><br>
        本行 <span class="num">${fmtWan(c.own)}</span> · 他行 <span class="num">${fmtWan(c.other)}</span><br>
        <span class="tag ${c.complain && S.turn-c.complain<=6?"bad":""}">${c.maint?"本月已维护":(due?"本月到期":`${c.due}月到期`)}${c.complain && S.turn-c.complain<=6?" · 投诉过":""}</span>
        <div class="rel"><i style="width:${c.rel}%"></i></div></button>`;
    }).join("") || `<p class="muted" style="grid-column:1/-1">${UI.custTab==="cmp"?"最近没有投诉。":"没有。"}</p>`;
    return `<h3>客户池 <em>点卡片维护，每次1点行动</em></h3>
      <div class="tabsx">${tabs.map(t=>`<button data-ct="${t[0]}" class="${UI.custTab===t[0]?"on":""}">${t[1]}${t[0]==="due"?` (${S.biz.cards.filter(c=>c.due===S.m&&!c.maint).length})`:""}</button>`).join("")}</div>
      <div class="cards">${cards}</div>`;
  },
  bindCust(){
    const box = $("custBox"); if(!box) return;
    box.querySelectorAll("[data-ct]").forEach(el => el.onclick = () => { UI.custTab = el.dataset.ct; box.innerHTML = UI.custHtml(); UI.bindCust(); });
    box.querySelectorAll("[data-card]").forEach(el => el.onclick = () => UI.pickProduct(el.dataset.card));
  },
  staffHtml(){
    return S.staff.map(s => {
      const roles = Object.keys(ROLE_NAME).map(r=>`<option value="${r}" ${s.role===r?"selected":""}>${ROLE_NAME[r]}</option>`).join("");
      return `<div class="sc ${s.off===S.turn?"off":""}" title="${esc(s.note)}">
        <div class="top"><b>${s.name}</b><select data-staff="${s.id}" ${S.phase!=="play"?"disabled":""}>${roles}</select></div>
        <div class="attrs">营销 <b>${s.mk}</b> 业务 <b>${s.op}</b> 合规 <b>${s.cp}</b></div>
        <div class="mini">倦怠<div class="bar"><i class="${s.fatigue>70?"lo":""}" style="width:${s.fatigue}%"></i></div></div>
        <div class="mini">好感<div class="bar"><i class="ok" style="width:${s.fav}%"></i></div></div>
        ${s.off===S.turn?'<small class="muted">本月休假</small>':`<small class="muted">${ROLE_DESC[s.role]}</small>`}
      </div>`;
    }).join("");
  },
  bindStaff(){
    $("colM").querySelectorAll("[data-staff]").forEach(el => el.onchange = () => { setRole(el.dataset.staff, el.value); log("", `${staff(el.dataset.staff).name}调到${ROLE_NAME[el.value]}岗。`); UI.refresh(); });
  },
  renderLog(){
    let html = "", last = null;
    S.log.slice(0, 90).forEach(l => {
      const k = (l.cy||l.y)+"-"+l.m;
      if(k !== last){ html += `<div class="mh">入行第${l.cy || (BALANCE.start.careerYear + l.y - 1)}年 · ${l.m}月</div>`; last = k; }
      html += `<p class="${l.cls||""}">${l.html}</p>`;
    });
    $("colR").innerHTML = `<div class="box log"><h3>日志与消息</h3>${html}</div>`;
  },

  /* ---------- 数字滚动 ---------- */
  rollAll(){
    document.querySelectorAll("[data-roll]").forEach(el => {
      const key = el.dataset.roll, txt = el.textContent;
      const m = txt.match(/-?[\d.]+/); if(!m) return;
      const to = parseFloat(m[0]), from = UI.rolls[key];
      UI.rolls[key] = to;
      if(from == null || from === to) return;
      const dec = (m[0].split(".")[1]||"").length, pre = txt.slice(0, m.index), suf = txt.slice(m.index + m[0].length);
      const t0 = performance.now(), D = 400;
      const step = now => { const k = Math.min(1,(now-t0)/D), v = from + (to-from)*(1-Math.pow(1-k,3)); el.textContent = pre + v.toFixed(dec) + suf; if(k<1) requestAnimationFrame(step); };
      requestAnimationFrame(step);
    });
  },

  /* ---------- 行动 ---------- */
  onAct(id){
    if(id === "maintain"){
      UI.custTab = "due"; UI.showTab("colM");
      const box = $("custBox"); box.innerHTML = UI.custHtml(); UI.bindCust();
      box.classList.remove("flash"); void box.offsetWidth; box.classList.add("flash");
      box.scrollIntoView({behavior:"smooth", block:"start"});
      return;
    }
    if(id === "hall"){ doHall(); UI.after(); return; }
    if(id === "rally"){ doRally(); UI.after(); return; }
    if(id === "boss"){ doBoss(); UI.after(); return; }
    if(id === "out"){
      const pc = B1().out.payroll;
      const opts = [
        {t:"去社区", s:"老人多，新客户和存款", odds:ODDS[1].out(), fn:()=>doOut("community")},
        {t:"走商户街", s:"个体户多，收单和信用卡", odds:ODDS[1].out(), fn:()=>doOut("street")},
      ];
      S.biz.prospects.filter(p=>!p.won).forEach(p => opts.push({t:`跑企业代发：${p.name}（${p.staff}人）`, s:`${p.note}${p.tries?` · 已跑${p.tries}回`:""} · 花营销费用${pc.cost}万`, disabled:S.biz.budget<pc.cost, odds:pc.baseP + (staffByRole("cm")[0]?staffByRole("cm")[0].mk:3)*pc.mkP + p.tries*pc.tryP, fn:()=>doOut("payroll", p.id)}));
      opts.push({t:"算了", s:"", cancel:true});
      UI.modal({kind:"pick", title:"外拓", body:"罗建把车钥匙拿在手上，等你说去哪。", opts}, UI.after);
      return;
    }
    if(id === "train"){
      const opts = [];
      S.staff.forEach(s => ["mk","op","cp"].forEach(a => { if(s[a] < B1().train.max) opts.push({t:`${s.name} · ${ATTR_NAME[a]} ${s[a]}→${s[a]+1}`, s:ROLE_NAME[s.role], odds:ODDS[1].train(s), fn:()=>doTrain(s.id,a)}); }));
      opts.push({t:"算了", s:"", cancel:true});
      UI.modal({kind:"pick", title:"带教", body:"带谁，教什么。", opts, compact:true}, UI.after);
    }
  },
  pickProduct(cardId){
    const c = card(cardId);
    if(!canAct("maintain").ok){ UI.toast(canAct("maintain").why); return; }
    if(c.maint){ UI.toast("这位客户本月已经维护过了"); return; }
    const b = B1();
    const opts = PRODUCTS.map(p => {
      const P = b.product[p.id];
      const fee = r2((c.own + c.other*(b.card.pullBase + c.rel*b.card.pullRel)*P.pull) * P.fee + P.feeFix);
      let s = p.tip + (fee ? ` · 中收约${fmtWan(fee)}` : "");
      return {t:p.name, s, odds:ODDS[1].maintain(c, p.id), fn:()=>doMaintain(c.id, p.id)};
    });
    opts.push({t:"算了", s:"", cancel:true});
    const T = CUST_TYPES[c.type];
    UI.modal({kind:"pick", title:c.name,
      body:`${T.name} · 风险测评R${c.risk} · 本行${fmtWan(c.own)} · 他行${fmtWan(c.other)} · ${c.due===S.m?"本月到期":c.due+"月到期"}${c.note?"\n\n"+c.note:""}`, opts}, UI.after);
  },
  after(){ UI.refresh(); },

  /* ---------- 弹窗 ---------- */
  modal(spec, done){
    const m = $("modal");
    let html = `<div class="modal"><h2>${esc(spec.title||"")}</h2>`;
    if(spec.kind === "report"){
      html += `<table class="rtab">${spec.rows.map(r=>`<tr><td>${r[0]}</td><td class="num">${r[1]}</td><td class="num muted">${r[2]}</td></tr>`).join("")}</table>`;
      (spec.ms||[]).forEach(ms => html += `<div class="ms"><b>里程碑 · ${ms.name}</b><br>${ms.ceremony}</div>`);
      if(spec.notes.length) html += `<div class="body">${spec.notes.map(n=>`<p class="muted" style="font-size:14px">${n}</p>`).join("")}</div>`;
      if(spec.quiet) html += `<div class="body"><p class="muted">${spec.quiet}</p></div>`;
    } else if(spec.kind === "kpi"){
      html += `<div class="body">${paras(spec.body)}</div><table class="rtab">${spec.items.map(i=>`<tr><td>${i.name}</td><td class="num">${i.unit==="万"?fmtWan(i.target):i.target+i.unit}</td><td class="num muted">权重${i.w}</td></tr>`).join("")}</table>`;
    } else if(spec.kind === "year"){
      html += `<div class="body">${paras(spec.body)}</div><table class="rtab">${spec.rec.items.map(i=>`<tr><td>${i.name}</td><td class="num">${Math.round(i.done*100)}%</td><td></td></tr>`).join("")}
        <tr><td><b>综合得分</b></td><td class="num"><b>${spec.rec.score.toFixed(1)}</b></td><td class="num">第${spec.rec.rank}名</td></tr></table>`;
    } else {
      html += `<div class="body">${paras(spec.body||"")}</div>`;
    }
    const opts = spec.opts || [{t:"好"}];
    html += `<div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}" ${o.disabled?"disabled":""} ${spec.compact?'style="min-height:40px;padding:6px 12px"':""}><b>${esc(o.t)}${o.odds!=null?oddsChip(o.odds):""}</b>${o.s?`<small>${esc(o.s)}</small>`:""}</button>`).join("")}</div></div>`;
    m.innerHTML = html;
    m.classList.remove("hidden");
    m.scrollTop = 0;
    m.querySelectorAll(".opt").forEach(el => el.onclick = () => {
      const o = opts[+el.dataset.i];
      m.classList.add("hidden"); m.innerHTML = "";
      if(o.fn) o.fn();
      if(done) done();
      UI.refresh();
      const ms = spec.kind!=="report" && S && S.phase==="play" ? checkMilestonesSoft() : [];
      ms.forEach(x => UI.toast(`里程碑 · ${x.name}`));
    });
  },
  toast(txt){
    const t = document.createElement("div"); t.className = "toast"; t.textContent = txt;
    document.body.appendChild(t); setTimeout(()=>t.remove(), 2700);
  },

  /* ---------- 窄屏标签 ---------- */
  showTab(t){
    if(t === "people"){ UI.showPeople(); return; }
    UI.tab = t;
    ["colL","colM","colR"].forEach(id => $(id).classList.toggle("show", id===t));
    document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.t===t));
  },

  /* ---------- 人脉簿 ---------- */
  showPeople(){
    const groups = {};
    S.people.filter(p=>p.met).forEach(p => { (groups[p.lvMet] = groups[p.lvMet] || []).push(p); });
    const lvName = {1:"网点时认识的", 2:"支行时认识的", 3:"万州时认识的", 4:"重庆分行时认识的", 5:"总行时认识的"};

          <div class="muted" style="margin-top:4px">${esc(p.recent || p.note || "")}</div></div>`).join("") + `</div>`;
    });
    const st = $("stage");

    st.classList.remove("hidden"); st.scrollTop = 0;
    $("pClose").onclick = () => { st.classList.add("hidden"); if(UI.tab==="people") UI.showTab("colM"); };

  showMenu(){
    UI.modal({kind:"pick", title:"菜单", body:`存档会自动保存。\n\n遇到 bug、觉得哪里数值不对，或者想要什么新功能，加微信直接说：<b class="wx">lynchrrr</b>`, opts:[
      {t:"切换亮色 / 暗色", s:"", fn:()=>{ const r = document.documentElement; const cur = r.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"); r.dataset.theme = cur==="dark"?"light":"dark"; }},
      {t:"复制微信号", s:"lynchrrr", fn:()=>{ const w = "lynchrrr"; (navigator.clipboard ? navigator.clipboard.writeText(w) : Promise.reject()).then(()=>UI.toast("微信号已复制"), ()=>UI.toast("微信号：lynchrrr")); }},
      {t:"放到桌面", s:"装好以后断网也能玩", fn:()=>INSTALL.show(true)},
      {t:"重新开一局", s:"当前进度会被覆盖", fn:()=>{ clearSave(); UI.start(); }},
      {t:"回到游戏", s:""},

      m.classList.remove("hidden");
      m.querySelectorAll("[data-d]").forEach(el => el.onclick = () => { const i = +el.dataset.d; alloc[i] = Math.max(0, alloc[i] + (+el.dataset.v)*step); render(); });

      $("dcOk").onclick = () => { m.classList.add("hidden"); m.innerHTML = ""; applyDecomp(alloc); done(); UI.refresh(); };
    };
    render();
  },

function wzMapSvg(){
  const pos = {laocheng:[225,126], gaotie:[330,121], jiangnan:[262,261], gongye:[428,121], wuqiao:[92,118], changling:[410,256]};
  const dots = S.biz.areas.map(a => {
    const [x,y] = pos[a.id];
    const n = S.biz.branches.filter(b=>b.area===a.id).reduce((s,b)=>s+b.outlets,0) + S.biz.newOutlets.filter(o=>o.area===a.id).length;
    const nn = S.biz.newOutlets.filter(o=>o.area===a.id).length;
    let g = "";
    for(let i=0;i<n;i++){ const cx = x - 30 + (i%6)*12, cy = y + 12 + Math.floor(i/6)*11; g += `<circle cx="${cx}" cy="${cy}" r="4.5" fill="${i >= n-nn ? "var(--gold)" : "var(--ink2)"}"/>`; }
    return `<g data-area="${a.id}" style="cursor:pointer">${g}<text x="${x-30}" y="${y}" font-size="12" fill="var(--muted)" font-family="sans-serif">热${Math.round(a.heat)} 争${a.comp}</text></g>`;
  }).join("");
  return SCENES.wzmap.replace("</svg>", dots + "</svg>");
}
