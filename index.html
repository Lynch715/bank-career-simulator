<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>银行升职记</title>
<meta name="theme-color" content="#16302b">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icon/icon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon/icon-180.png">
<link rel="manifest" href="site.webmanifest">
<meta name="apple-mobile-web-app-title" content="银行升职记">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script id="iosfix">
/* iPhone 从桌面打开时,系统给网页的高度比屏幕短一截,底部会空出来。直接按屏幕高度撑满。 */
(function(){
  var ios=/iPhone|iPad|iPod/.test(navigator.userAgent);
  var sa=navigator.standalone===true || (window.matchMedia && (matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches));
  if(!ios||!sa) return;
  var r=document.documentElement; r.classList.add('iosfix');
  function fix(){
    // 实测(iOS 26):屏幕 393×852,系统给的视口 462×932,按宽度缩放后只盖到屏幕的 793,底下少一截状态栏的高度。
    // 按视口宽度 × 屏幕长宽比,算出铺满整块屏幕需要的高度。
    var a=Math.max(screen.width,screen.height), b=Math.min(screen.width,screen.height), land=innerWidth>innerHeight;
    var h=Math.round(innerWidth*(land?b/a:a/b));
    h=Math.max(h, innerHeight);
    r.style.setProperty('--apph',h+'px'); r.style.setProperty('--apgap',Math.max(0,h-innerHeight)+'px');
  }
  fix(); addEventListener('resize',fix); addEventListener('orientationchange',function(){setTimeout(fix,300)}); addEventListener('pageshow',fix);
})();
</script>
<style>
:root{
  --ink:#16302b; --ink2:#23463f; --paper:#f5f1e8; --paper2:#ebe5d6; --card:#fffdf8;
  --gold:#a8894a; --gold2:#c9ab6a; --goldt:#7a5f28; --text:#1d2522; --muted:#5c615c; --line:#d9d2c1;
  --good:#2f6b4f; --bad:#a0473a; --warn:#9a6a1f; --red:#b0302a;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
  --r:10px;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --serif:"Songti SC","STSong","Noto Serif CJK SC","SimSun",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#0f1f1b; --ink2:#1b332d; --paper:#141a18; --paper2:#1b2320; --card:#1e2724;
    --gold:#c9ab6a; --gold2:#d8bd82; --goldt:#d2b577; --text:#e8e2d4; --muted:#9aa29c; --line:#2f3a36;
    --good:#6fb08d; --bad:#d8796b; --warn:#d6a24f; --red:#e0574f;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --ink:#0f1f1b; --ink2:#1b332d; --paper:#141a18; --paper2:#1b2320; --card:#1e2724;
  --gold:#c9ab6a; --gold2:#d8bd82; --goldt:#d2b577; --text:#e8e2d4; --muted:#9aa29c; --line:#2f3a36;
  --good:#6fb08d; --bad:#d8796b; --warn:#d6a24f; --red:#e0574f;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
#app{position:fixed;inset:0}
html.iosfix,html.iosfix body{height:var(--apph);background:var(--card)}
html.iosfix #app,html.iosfix .stage,html.iosfix .overlay{bottom:auto;height:var(--apph)}
body{background:var(--paper);color:var(--text);font:14px/1.6 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:disabled{cursor:not-allowed;opacity:.45}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* 顶栏 */
#top{min-height:56px;background:var(--ink);color:#efe9da;display:flex;align-items:center;gap:14px;padding:env(safe-area-inset-top) calc(16px + env(safe-area-inset-right)) 0 calc(16px + env(safe-area-inset-left));position:relative;z-index:5}
#top .who{font-family:var(--serif);font-size:18px;letter-spacing:1px;white-space:nowrap}
#top .meta{font-size:12px;color:#c9c2ae;white-space:nowrap}
#top .ap{display:flex;gap:4px;align-items:center}
#top .ap i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--gold2);display:inline-block}
#top .ap i.on{background:var(--gold2)}
#top .cores{display:flex;gap:6px;margin-left:auto}
.core{background:rgba(255,255,255,.07);border-radius:8px;padding:3px 9px;text-align:center;min-width:52px}
.core b{display:block;font-size:15px;line-height:1.2}
.core span{font-size:12px;color:#bdb6a2}
.clean-ico{font-size:18px;cursor:help;padding:0 4px}
.win-badge{background:var(--gold);color:#1a1a14;border-radius:6px;padding:3px 8px;font-size:12px;font-weight:600;white-space:nowrap}
.topbtn{min-height:40px;padding:0 10px;border-radius:8px;color:#e9e3d1;font-size:13px}
.topbtn:hover{background:rgba(255,255,255,.08)}

/* 三栏 */
#main{display:grid;grid-template-columns:300px 1fr 300px;grid-template-rows:minmax(0,1fr);gap:14px;padding:14px;height:calc(100% - var(--toph,56px))}
.col{overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.box h3{margin:0 0 10px;font-size:13px;color:var(--muted);font-weight:600;letter-spacing:1px;display:flex;justify-content:space-between;align-items:baseline}
.box h3 em{font-style:normal;color:var(--text);font-size:12px;font-weight:400}

/* 考核卡 */
.kpi-it{margin-bottom:10px}
.kpi-it .l{display:flex;justify-content:space-between;font-size:13px}
.kpi-it .l small{color:var(--muted)}
.bar{height:6px;background:var(--paper2);border-radius:3px;overflow:hidden;margin-top:4px;position:relative}
.bar i{display:block;height:100%;background:var(--ink2);border-radius:3px;transition:width .4s}
.bar i.ok{background:var(--good)}
.bar i.lo{background:var(--warn)}
.bar .pace{position:absolute;top:-2px;width:2px;height:10px;background:var(--gold)}
.score{display:flex;justify-content:space-between;align-items:baseline;border-top:1px dashed var(--line);padding-top:8px;margin-top:4px}
.score b{font-size:22px;font-family:var(--serif)}
.rank-t{width:100%;border-collapse:collapse;font-size:13px}
.rank-t td{padding:5px 4px;border-bottom:1px solid var(--line)}
.rank-t tr.me td{background:rgba(168,137,74,.14);font-weight:600}
.rank-t td.n{width:22px;color:var(--muted)}
.rank-t td.s{text-align:right}
.arr-up{color:var(--good)} .arr-dn{color:var(--bad)}

/* 面板 */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.stat{background:var(--paper2);border-radius:8px;padding:8px 10px}
.stat span{font-size:12px;color:var(--muted);display:block}
.stat b{font-size:17px;font-family:var(--serif)}
.task{margin-top:10px;font-size:13px;padding:8px 10px;border-left:3px solid var(--gold);background:rgba(168,137,74,.08);border-radius:0 6px 6px 0}
.task.done{border-color:var(--good);opacity:.7}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.act{min-height:56px;text-align:left;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);transition:border-color .15s,transform .1s}
.act:hover:not(:disabled){border-color:var(--gold)}
.act:active:not(:disabled){transform:scale(.98)}
.act b{display:block;font-size:14px}
.act small{display:block;font-size:12px;color:var(--muted);line-height:1.4}
.endbar{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:12px}
.btn{min-height:42px;padding:0 18px;border-radius:8px;background:var(--ink);color:#f3edde;font-weight:600;letter-spacing:1px}
.btn:hover:not(:disabled){background:var(--ink2)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.gold{background:var(--gold);color:#1b1a12}
.tabsx{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap}
.tabsx button{min-height:40px;padding:0 12px;border-radius:8px;font-size:13px;color:var(--muted)}
.tabsx button.on{background:var(--paper2);color:var(--text);font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cc{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--card);text-align:left;min-height:84px;position:relative;font-size:12px;line-height:1.5}
.cc:hover{border-color:var(--gold)}
.cc b{font-size:14px}
.cc .rk{position:absolute;right:8px;top:8px;font-size:12px;padding:0 5px;border-radius:4px;background:var(--paper2)}
.cc .rk.hi{background:rgba(160,71,58,.15);color:var(--bad)}
.cc.due{border-left:3px solid var(--gold)}
.cc.done{opacity:.55}
.cc .rel{height:3px;background:var(--paper2);border-radius:2px;margin-top:4px}
.cc .rel i{display:block;height:100%;background:var(--gold);border-radius:2px}
.cc .tag{font-size:12px;color:var(--goldt)}
.cc .tag.bad{color:var(--bad)}
.staffs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.sc{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px}
.sc.off{opacity:.5}
.sc .top{display:flex;justify-content:space-between;align-items:center}
.sc b{font-size:14px}
.sc select{font:inherit;font-size:12px;min-height:32px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--text);padding:0 4px}
.sc .attrs{display:flex;gap:8px;margin:4px 0;color:var(--muted)}
.sc .attrs b{font-size:12px;color:var(--text)}
.mini{display:flex;align-items:center;gap:6px;color:var(--muted)}
.mini .bar{flex:1;margin:0;height:4px}
.hint{font-size:12px;color:var(--muted);margin:0 0 8px}
.flash{animation:flash 1s}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(168,137,74,.6)}100%{box-shadow:0 0 0 10px rgba(168,137,74,0)}}

/* 日志 */
.log p{margin:0 0 8px;font-size:13px;line-height:1.65;padding-left:10px;border-left:2px solid transparent}
.log p.good{border-color:var(--good)}
.log p.bad{border-color:var(--bad)}
.log p.warn{border-color:var(--warn)}
.log p.gold{border-color:var(--gold);background:rgba(168,137,74,.07)}
.log p.group{color:var(--muted);font-size:12px}
.log .mh{font-size:12px;color:var(--muted);letter-spacing:1px;margin:10px 0 6px;border-bottom:1px solid var(--line)}
.log .num{color:var(--muted);font-size:12px;margin-left:4px;white-space:nowrap}

/* 弹窗 */
.overlay{position:fixed;inset:0;background:rgba(10,16,14,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--card);border-radius:14px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);padding:22px 22px 18px}
.modal h2{margin:0 0 12px;font-family:var(--serif);font-size:20px;letter-spacing:2px}
.modal .body p{margin:0 0 10px;line-height:1.85;font-size:15px}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.opt{text-align:left;padding:10px 14px;border:1px solid var(--line);border-radius:10px;min-height:48px;background:var(--card)}
.opt:hover:not(:disabled){border-color:var(--gold);background:rgba(168,137,74,.05)}
.opt b{display:block;font-weight:500;font-size:15px}
.opt small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.rtab{width:100%;border-collapse:collapse;font-size:14px;margin:4px 0 10px}
.rtab td{padding:6px 2px;border-bottom:1px solid var(--line)}
.rtab td:nth-child(2),.rtab td:nth-child(3){text-align:right}
.ms{background:rgba(168,137,74,.12);border-radius:8px;padding:10px 12px;margin:8px 0;font-size:14px}
.ms b{color:var(--goldt)}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--ink);color:#f3edde;padding:10px 18px;border-radius:10px;z-index:80;box-shadow:0 8px 30px rgba(0,0,0,.3);font-size:14px;animation:toast 2.6s forwards;pointer-events:none;max-width:90vw}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-10px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}

/* 全屏舞台(升职流程) */
.stage{position:fixed;inset:0;background:var(--paper);z-index:60;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:calc(40px + env(safe-area-inset-top)) 16px calc(60px + env(safe-area-inset-bottom))}
.stage .inner{max-width:680px;width:100%}
.stage h1{font-family:var(--serif);font-size:26px;letter-spacing:4px;margin:10px 0 18px;text-align:center}
.stage .lead{font-size:15px;line-height:1.9;color:var(--text)}
.stage .lead p{margin:0 0 12px}
.stage .next{display:flex;justify-content:center;margin-top:24px;gap:10px}
.votes{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin:18px 0}
.vote{height:110px;perspective:600px}
.vote .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.vote.flip .in{transform:rotateY(180deg)}
.vote .f,.vote .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid var(--line);font-size:12px;text-align:center;padding:6px}
.vote .f{background:var(--paper2);color:var(--muted)}
.vote .f b{font-family:var(--serif);font-size:22px;color:var(--gold)}
.vote .b{background:var(--card);transform:rotateY(180deg)}
.vote .b b{font-size:18px;font-family:var(--serif);margin-top:4px}
.v-good{color:var(--good)} .v-ok{color:var(--text)} .v-bad{color:var(--bad)}
.tally{text-align:center;font-size:14px;color:var(--muted)}
.stmts{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.stmt{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;min-height:48px;text-align:left;background:var(--card)}
.stmt.on{border-color:var(--gold);background:rgba(168,137,74,.08)}
.stmt .dot{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--line);flex:none}
.stmt.on .dot{background:var(--gold);border-color:var(--gold)}
.stmt .str{margin-left:auto;color:var(--goldt);letter-spacing:2px;font-size:12px}
.bars{margin:20px 0}
.brow{display:grid;grid-template-columns:120px 1fr 44px;align-items:center;gap:10px;margin:10px 0;font-size:14px}
.brow .bar{height:14px;border-radius:7px;margin:0}
.brow .bar i{transition:width 1.2s cubic-bezier(.2,.8,.2,1);width:0}
.brow.me{font-weight:600}
.brow.me .bar i{background:var(--gold)}
.brow b{font-family:var(--serif);font-size:18px;text-align:right}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:24px 0}
.day{height:64px;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:18px;color:var(--muted);transition:background .3s}
.day.lit{background:var(--ink);color:#f3edde}
.day.alarm{background:var(--bad);color:#fff}
.doc{background:#fffdf7;color:#1a1a1a;max-width:520px;margin:10px auto;padding:36px 34px 40px;box-shadow:0 10px 40px rgba(0,0,0,.18);font-family:var(--serif);position:relative;animation:docin .6s}
@keyframes docin{from{opacity:0;transform:translateY(20px)}}
.doc .hd{color:var(--red);text-align:center;font-size:28px;letter-spacing:6px;font-weight:700;border-bottom:2px solid var(--red);padding-bottom:12px}
.doc .no{text-align:center;font-size:13px;margin:10px 0 18px}
.doc .tt{text-align:center;font-size:19px;font-weight:700;margin-bottom:18px}
.doc p{font-size:15px;line-height:2;margin:0 0 6px}
.doc .sg{text-align:right;margin-top:26px;white-space:pre-line;font-size:14px}
.doc .stamp{position:absolute;right:28px;bottom:14px;width:108px;height:108px;border:3px solid rgba(176,48,42,.75);border-radius:50%;color:rgba(176,48,42,.8);display:flex;align-items:center;justify-content:center;font-size:12px;text-align:center;transform:rotate(-14deg) scale(1.6);opacity:0;animation:stamp .35s .9s forwards}
@keyframes stamp{to{opacity:1;transform:rotate(-14deg) scale(1)}}
.scene{margin:10px auto;max-width:520px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.scene svg{display:block;width:100%;height:auto}
.cap{text-align:center;color:var(--muted);font-size:14px;margin-top:10px}
.calls p{font-size:17px;font-family:var(--serif);text-align:center;opacity:0;animation:fade .6s forwards}
.bigage{text-align:center;font-family:var(--serif);font-size:48px;color:var(--gold);margin:12px 0}

/* L2 占位 */
.l2t{width:100%;border-collapse:collapse;font-size:14px}
.l2t th{text-align:left;font-size:12px;color:var(--muted);font-weight:500;padding:6px;border-bottom:1px solid var(--line)}
.l2t td{padding:10px 6px;border-bottom:1px solid var(--line)}
.l2t tr.mine td{background:rgba(168,137,74,.12)}
.l2t tr.mine td:first-child{font-weight:600}
.wip{margin-top:14px;padding:14px;border:1px dashed var(--gold);border-radius:10px;color:var(--muted);font-size:13px;text-align:center}
.zoomer{position:fixed;z-index:70;overflow:hidden;transform-origin:0 0;transition:transform .6s cubic-bezier(.3,.7,.2,1),opacity .6s;background:var(--paper);pointer-events:auto;cursor:pointer;border-radius:10px}
.l2in{animation:fade .8s}
.mapin{animation:mapin 1s ease-out}
@keyframes mapin{from{opacity:0;transform:scale(1.08)}}

/* L2 */
.tscroll{overflow-x:auto}
.tscroll .l2t{min-width:520px}
.tscroll .l2t td,.tscroll .l2t th{white-space:nowrap}
.l2t tr[data-outlet]{cursor:pointer}
.l2t tr[data-outlet]:hover td,.l2t tr[data-outlet]:focus td{background:rgba(168,137,74,.08)}
.l2t .mini{min-width:70px}
.neg{color:var(--bad)} .okx{color:var(--good)} .warnx{color:var(--warn)} .gold{color:var(--goldt)}
.tagx{font-size:12px;color:var(--goldt);border:1px solid var(--gold);border-radius:4px;padding:0 4px;margin-left:4px}
.btn.sm{min-height:36px;padding:0 14px;font-size:13px}
.lq{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.ln{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.ln .lh{display:flex;justify-content:space-between;gap:6px;font-size:14px}
.ln .lm{color:var(--muted)}
.ln .rel{color:var(--warn);font-size:12px;margin-top:2px}
.ln .lb{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.ln .lb.npab{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ln .lb.npab .btn.sm{min-height:44px;min-width:0;padding:0 4px;font-size:13px;letter-spacing:0}
.mixr{display:grid;grid-template-columns:44px 1fr 44px 70px;gap:10px;align-items:center;margin:6px 0;font-size:13px}
.fitrow{display:flex;flex-wrap:wrap;gap:4px 10px}
.fitrow span{white-space:nowrap}
.fitrow span b{margin-left:2px}
.fitrow span.cur{color:var(--goldt)}
.mixr input{width:100%;accent-color:var(--ink2)}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kcol{background:var(--paper2);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kh{font-size:12px;color:var(--muted);text-align:center;letter-spacing:2px}
.pj{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.pj b{font-size:13px}
.pj.empty{color:var(--muted);text-align:center;cursor:default;background:transparent;border-style:dashed}
.pj.tier-high{border-left:3px solid var(--bad)} .pj.tier-mid{border-left:3px solid var(--warn)} .pj.tier-low{border-left:3px solid var(--good)}
.dots{display:flex;gap:3px;margin-top:2px}
.dots i{width:8px;height:8px;border-radius:50%;border:1px solid var(--gold)}
.dots i.on{background:var(--gold)}
.dc{display:grid;grid-template-columns:1fr auto 56px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.dcb{display:flex;align-items:center;gap:8px}
.dcb b{min-width:64px;text-align:center}
.dct{font-size:12px;text-align:right}
@media (max-width:760px){ .kanban{grid-template-columns:repeat(2,minmax(0,1fr))} .lq{grid-template-columns:1fr} }

/* 人脉簿 */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.pc{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card);font-size:12px}
.pc b{font-size:15px;font-family:var(--serif)}
.pgrid.dex{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.odds{font-style:normal;font-size:12px;font-weight:600;margin-left:6px;padding:1px 6px;border-radius:9px;vertical-align:2px;white-space:nowrap;font-family:var(--font);letter-spacing:0}
.odds-sure{background:rgba(47,107,79,.14);color:var(--good)}
.odds-maybe{background:rgba(154,106,31,.14);color:var(--warn)}
.odds-risky{background:rgba(160,71,58,.14);color:var(--bad)}
.pc.locked{opacity:.5;border-style:dashed}
.dial{padding:8px 0;border-bottom:1px dashed var(--line)}
.dial:last-child{border-bottom:0}
.dial .dh{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:13px}
.dial .dh span{font-size:12px}
.dial .dr{display:flex;gap:8px;align-items:center;margin-top:6px;font-size:12px;color:var(--muted)}
.dial input[type=range]{flex:1;min-width:0;accent-color:var(--gold)}
.dial .dr b{color:var(--text);width:14px;text-align:right}
.bioimg img{width:100%;max-width:420px;display:block;margin:0 auto;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,.15)}
.pc .pos{color:var(--goldt);margin:2px 0}
.pgroup{font-size:12px;color:var(--muted);letter-spacing:2px;margin:16px 0 8px}

/* 开局 */
.start{max-width:440px;margin:8vh auto 0;text-align:center}
.start h1{font-family:var(--serif);font-size:40px;letter-spacing:10px;margin:0;color:var(--ink)}
.start .sub{color:var(--muted);margin:6px 0 30px;letter-spacing:2px}
.start .nm{display:flex;gap:10px;justify-content:center;margin:18px 0}
.start input{font:inherit;font-size:18px;width:110px;min-height:46px;border:1px solid var(--line);border-radius:8px;text-align:center;background:var(--card);color:var(--text)}
.start .btns{display:flex;flex-direction:column;gap:10px;align-items:center}
.start .btn{min-width:220px}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .start h1{color:var(--gold)} }

/* 窄屏 */
#tabs{display:none}
@media (max-width:760px){
  #top{min-height:0;flex-wrap:wrap;gap:6px 10px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px}
  #top .who{font-size:16px}
  #top .cores{margin-left:0;width:100%;justify-content:space-between}
  .core{flex:1;min-width:0}
  #main{display:block;padding:10px;height:calc(100% - var(--toph,96px) - 58px - env(safe-area-inset-bottom));overflow:hidden}
  #main .col{height:100%;display:none}
  #main .col.show{display:block}
  #tabs{display:flex;position:absolute;left:0;right:0;bottom:0;height:calc(58px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);z-index:6;padding-bottom:env(safe-area-inset-bottom)}
  #tabs button{flex:1;min-height:58px;font-size:13px;color:var(--muted)}
  #tabs button.on{color:var(--ink);font-weight:700}
  .stats{grid-template-columns:repeat(3,1fr)}
  .acts{grid-template-columns:repeat(2,1fr)}
  .cards{grid-template-columns:repeat(2,1fr)}
  .staffs{grid-template-columns:1fr 1fr}
  .brow{grid-template-columns:80px 1fr 38px}
  .doc{padding:26px 18px 34px}
  .doc .hd{font-size:22px;letter-spacing:3px}
  .modal{padding:18px 16px 14px}
  .stage{padding:calc(24px + env(safe-area-inset-top)) 14px calc(50px + env(safe-area-inset-bottom))}
}
@media (max-width:760px) and (prefers-color-scheme: dark){ :root:not([data-theme="light"]) #tabs button.on{color:var(--gold)} }
#installBar{position:fixed;left:0;right:0;bottom:0;z-index:90;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:none}
#installBar.on{display:block}
#installBar .ib-in{max-width:560px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.25);padding:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
#installBar img{width:44px;height:44px;border-radius:10px}
#installBar .ib-t{flex:1;min-width:180px;font-size:14px;line-height:1.6}
#installBar .ib-b{display:flex;gap:8px;margin-left:auto}
@media (max-width:760px){ #installBar{bottom:calc(58px + env(safe-area-inset-bottom) - var(--apgap,0px))} }
html.iosfix #installBar{margin-bottom:0}
@media (min-width:761px){ html.iosfix #installBar{bottom:calc(0px - var(--apgap,0px))} }
/* 触控目标不小于 44 */
.ln .lb .btn{min-height:44px;min-width:52px}
input[type=range]{height:32px}
small{font-size:max(12px,.85em)}
.wx{font-family:ui-monospace,Menlo,monospace;color:var(--goldt);font-size:16px}
</style>
</head>

/* 称呼 */
function titleOf(S){
  const sur = S.player.sur;
  if(S.lv===1) return S.turn>12 ? `${sur}主任` : `小${sur}`;
  if(S.lv===2) return `${sur}行`;

/* =====================================================================
   引擎:随机数、状态、工具函数
   ===================================================================== */
const HEADLESS = (typeof document === "undefined");
let FORCE_HL = false;
const isHL = () => HEADLESS || FORCE_HL;
let S = null;
let R = Math.random;

function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function seedRng(seed){ R = mulberry32(seed>>>0); }
const rint = (a,b)=> a + Math.floor(R()*(b-a+1));
const rr = (arr)=> arr[0] + R()*(arr[1]-arr[0]);
const ri = (arr)=> rint(arr[0], arr[1]);
const pick = (arr)=> arr[Math.floor(R()*arr.length)];
const clamp = (v,a,b)=> Math.max(a, Math.min(b, v));
const c100 = v => clamp(v, 0, 100);
const gauss = ()=>{ let u=0,v=0; while(!u) u=R(); while(!v) v=R(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); };
const r1 = v => Math.round(v*10)/10;
const r2 = v => Math.round(v*100)/100;
const B1 = ()=> BALANCE.L1;

/* ---------- 数字格式 ---------- */
function fmtWan(v){ // 万元 → 合适单位
  const a = Math.abs(v);
  if(a >= 10000) return (v/10000).toFixed(2) + "亿";
  if(a >= 100) return Math.round(v) + "万";
  return r1(v) + "万";
}
function fmtYi(v){ return (v/10000).toFixed(2) + "亿"; }
function sgn(v, f){ return (v>=0?"+":"") + (f?f(v):v); }

function initL1(){
  const b = B1();
  // 员工
  S.staff = STAFF_L1.map(s => Object.assign({}, s, {off:0, trained:0}));
  // 客户卡
  const cards = [];
  CUST_FIXED.forEach(c => cards.push(Object.assign({maint:false, complain:0, fixed:true}, c)));
  let ni = 0;
  while(cards.length < 40){
    const type = CUST_TYPE_SEQ[cards.length % CUST_TYPE_SEQ.length];
    const T = CUST_TYPES[type];
    cards.push({
      id: "c"+cards.length, name: CUST_NAMES[ni++ % CUST_NAMES.length], type,
      risk: ri(T.risk), own: Math.round(rr(T.own)), other: Math.round(rr(T.other)),
      due: rint(1,12), rel: ri(T.rel), maint:false, complain:0,
    });
  }
  const cardSum = cards.reduce((a,c)=>a+c.own, 0);
  S.biz = {
    base: b.depStart - cardSum,
    cards,
    budget: b.budgetMonthly,
    csat: b.csatStart,
    prospects: PAYROLL_PROSPECTS.map(p => Object.assign({tries:0, won:false}, p)),
    payrollInflow: 0,
    task: null, taskDone: false,
    rallied: false, bossDone: false,
    noErrStreak: 0,
    timepoint: 0,
  };
  // 对手
  S.rivals = RIVALS_L1.map(r => Object.assign({}, r, {shift:0, score:r.base, bonus:0}));
  // 人脉
  S.people = [];
  PEOPLE_DEF.forEach(p => S.people.push(Object.assign({lvMet:1, pos:p.role, met:!p.hidden, recent:"", arc:0, alive:true, kind:"npc"}, p)));
  S.staff.forEach(s => S.people.push({id:s.id, name:s.name, role:ROLE_NAME[s.role], group:"部下", lvMet:1, pos:"弹子石网点"+ROLE_NAME[s.role],
    fav:s.fav, note:s.note, met:true, recent:"", kind:"staff", alive:true}));
  ["zhangxf","ranguoq"].forEach(id => {
    const c = cards.find(x=>x.id===id);
    S.people.push({id, name:c.name, role:"客户", group:"客户", lvMet:1, pos:c.id==="ranguoq"?"冉记老灶老板":"退休", fav:c.rel, note:c.note, met:true, recent:"", kind:"cust", alive:true});
  });
}

/* ---------- 取值 ---------- */
function depTotal(){ return [null,depTotalL1,depTotalL2,depTotalL3,depTotalL4,depTotalL5][S.lv](); }
function depTotalL1(){ return S.biz.base + S.biz.cards.reduce((a,c)=>a+c.own, 0) + S.biz.timepoint; }
function person(id){ return S.people.find(p=>p.id===id); }
function staff(id){ return S.staff.find(s=>s.id===id); }
function staffByRole(role){ return S.staff.filter(s=>s.role===role && s.off!==S.turn); }
function card(id){ return S.biz.cards ? S.biz.cards.find(c=>c.id===id) : null; }
function nick(){ return titleOf(S); }
function pr(s){ return s.sex==="m" ? "他" : "她"; }

/* ---------- 改数 ---------- */
function log(cls, html){
  S.log.unshift({t:S.turn, y:S.year, cy:S.careerYear, m:S.m, lv:S.lv, cls, html});
  if(S.log.length > 160) S.log.length = 160;
}
function fav(id, d){
  const p = person(id); if(!p) return;
  p.fav = c100(p.fav + d);
  const s = staff(id); if(s) s.fav = p.fav;
  const c = card(id); if(c) c.rel = p.fav;
}
function sfav(id, d){ const s = staff(id); if(!s) return; s.fav = c100(s.fav + d); const p = person(id); if(p) p.fav = s.fav; }
function allStaffFav(d){ S.staff.forEach(s => sfav(s.id, d)); }
function meet(id){ const p = person(id); if(p && !p.met){ p.met = true; p.lvMet = S.lv; } }
function dirt(n){ S.core.clean = c100(S.core.clean - n); S.flags.grayCount = (S.flags.grayCount||0)+1; }
function depAdd(v){ S.biz.base += v; }
function feeAdd(v){ S.kpi.ytd.fee += v; S.month.fee += v; }
function custAdd(v){ v = Math.round(v); S.kpi.ytd.cust += v; S.month.cust += v; }
function cardAdd(v){ v = Math.round(v); S.kpi.ytd.card += v; S.month.card += v; }
function csatAdd(v){ S.biz.csat = c100(S.biz.csat + v); }
function compAdd(v){ S.kpi.comp = c100(S.kpi.comp + v); if(v<0) S.month.compHit += -v; }
function budgetAdd(v){ S.biz.budget = Math.max(0, r2(S.biz.budget + v)); }
function apUse(n){ S.ap = Math.max(0, S.ap - (n||1)); }
function keyEvent(txt){ S.track.keyEvents.push({lv:S.lv, turn:S.turn, age:S.age, txt}); }
function schedule(id, delay, data){ S.sched.push({id, at:S.turn + delay, data:data||null, lv:S.lv}); }
function resetNoErr(){ S.biz.noErrStreak = 0; }

/* ---------- 考核卡 ---------- */
function issueKpi(){ const r = [null,issueKpiL1,issueKpiL2,issueKpiL3,issueKpiL4,issueKpiL5][S.lv](); whipTargets(); return r; }
function issueKpiL1(){
  const b = B1();
  const g = Math.pow(b.kpiGrowth, Math.min(S.year-1, b.kpiGrowthYears));
  S.kpi.card = KPI_DEF[1].map(d => {
    const base = b.kpiTarget[d.k];
    const target = d.kind==="flow" ? Math.round(base*g) : base;
    return Object.assign({}, d, {target, actual:0, done:0, pace:0});
  });
  S.kpi.depStart = depTotal() - S.biz.timepoint;
  S.kpi.ytd = {fee:0, cust:0, card:0};
  S.kpi.comp = b.compStart;
}
function monthsInYear(){ return S.m; }   // 结算时:本年已过月数(含本月)
function kpiActual(k){
  if(S.lv===2) return kpiActualL2(k);
  if(S.lv===3) return kpiActualL3(k);
  if(S.lv===4) return kpiActualL4(k);
  if(S.lv===5) return kpiActualL5(k);
  switch(k){
    case "dep":  return depTotal() - S.kpi.depStart;
    case "fee":  return S.kpi.ytd.fee;
    case "cust": return S.kpi.ytd.cust;
    case "card": return S.kpi.ytd.card;
    case "csat": return S.biz.csat;
    case "comp": return S.kpi.comp;
  }
  return 0;
}
function computeKpi(elapsed){
  const cap = BALANCE.kpiCap;
  let score = 0;
  S.kpi.card.forEach(it => {
    it.actual = kpiActual(it.k);
    it.done = it.target ? it.actual / it.target : 0;
    if(it.kind==="flow"){
      const exp = it.target * elapsed / 12;
      it.pace = exp>0 ? clamp(it.actual/exp, 0, cap) : 0;
    } else if(it.kind==="lower"){
      it.done = it.actual > 0 ? it.target / it.actual : cap;
      it.pace = clamp(it.done, 0, cap);
    } else if(it.kind==="floor"){
      it.pace = clamp(it.done, 0, 1);      // 达标即可,多了不加分
    } else {
      it.pace = clamp(it.done, 0, cap);
    }
    score += it.pace * it.w;
  });
  S.kpi.score = r1(score);
  return S.kpi.score;
}

/* ---------- 对手与排名 ---------- */
function stepRivals(newYear){
  const cfg = BALANCE["rivalL"+S.lv] || BALANCE.rivalL1;
  S.rivals.forEach(r => {
    if(newYear) r.shift += (STYLE_TREND[r.style]||0)*cfg.trendSd + gauss()*cfg.yearShift;
    r.score = r1(r.base + r.shift + gauss()*cfg.sd + (r.bonus||0) + (r.chase||0));
    r.bonus = 0;
  });
}
function computeRank(){
  if(S.lv===5) return computeRankL5();
  const list = S.rivals.map(r=>({id:r.id, name:r.name, boss:r.boss, score:r.score, me:false}));
  list.push({id:"me", name:myUnitName(), boss:S.player.sur+S.player.given, score:S.kpi.score, me:true});
  list.sort((a,b)=>b.score-a.score);
  const rank = list.findIndex(x=>x.me) + 1;
  S.kpi.prevRank = S.kpi.rank || rank;
  S.kpi.rank = rank;
  S.kpi.table = list;
  return rank;
}

/* ---------- 四项核心值 ---------- */
function computeCore(){
  const c = BALANCE.core;
  if(S.track.scoreHistory.length) S.core.perf = Math.round(c100((S.kpi.score - c.perfFrom) * c.perfK));
  const subs = subordinates();
  const favAvg = subs.length ? subs.reduce((a,s)=>a+s.fav,0)/subs.length : 50;
  S.core.rep = Math.round(c100(favAvg*c.repStaff + S.biz.csat*c.repCsat));
  const w = c.trustByLv[S.lv] || c.trustByLv[1];
  S.track.minClean = Math.min(S.track.minClean==null?100:S.track.minClean, S.core.clean);
  S.core.trust = Math.round(c100(Object.entries(w).reduce((a,[id,k]) => a + (person(id) ? person(id).fav : 50) * k, 0)));
}
function computeAll(){ computeKpi(Math.max(1, S.m)); stepRivals(false); computeRank(); computeCore(); }

function myUnitName(){ return [null,"弹子石网点","南岸支行","万州分行","重庆分行","泰和银行"][S.lv] || ""; }

/* ---------- 月末结算 ---------- */
function settleMonth(){ return [null,settleL1,settleL2,settleL3,settleL4,settleL5][S.lv](); }
function settleL1(){
  const b = B1(), rl = b.role;
  const M = S.month;
  const kmh = (S.m <= 3) ? (b.kmhMult||1) : 1;
  // 1 员工产出
  S.staff.forEach(s => {
    if(s.off === S.turn) return;
    const eff = (1 - s.fatigue/b.fatigueDiv) * (S.biz.rallied ? (S.biz.rallyFlop ? 1 + (b.rally.mult-1)*BALANCE.odds.L1.rally.flopMult : b.rally.mult) : 1) * kmh;
    if(s.role==="teller"){
      csatAdd((rl.teller.csatBase + (s.op-5)*rl.teller.csatK) * 0.5);
      custAdd(s.mk * rl.teller.custK * eff);
      const pErr = Math.max(rl.teller.errMin, rl.teller.errBase + (6-s.op)*rl.teller.errSkill + s.fatigue*rl.teller.errFat - s.cp*rl.teller.errComp);
      if(R() < pErr){ M.errors++; compAdd(-3); }
    } else if(s.role==="lobby"){
      custAdd(s.mk * rl.lobby.custK * eff);
      cardAdd(s.mk * rl.lobby.cardK * eff);
      depAdd(s.mk * rl.lobby.depK * eff);
      csatAdd(rl.lobby.csatBase + (s.mk-5)*rl.lobby.csatK);
    } else if(s.role==="wealth"){
      feeAdd(s.mk * rl.wealth.feeK * eff);
      depAdd(s.mk * rl.wealth.depK * eff);
    } else if(s.role==="cm"){
      custAdd(s.mk * rl.cm.custK * eff);
      depAdd(s.mk * rl.cm.depK * eff);
      cardAdd(s.mk * rl.cm.cardK * eff);
    }
  });
  if(!staffByRole("lobby").length) csatAdd(-2);
  if(!staffByRole("teller").length) csatAdd(-4);
  if(M.errors){ resetNoErr(); } else { S.biz.noErrStreak++; }
  // 2 客户到期
  const cb = b.card;
  S.biz.cards.forEach(c => {
    if(c.due === S.m && !c.maint && c.own > 0){
      const keep = cb.retainBase + c.rel*cb.retainRel;
      if(R() > keep){
        const out = Math.round(c.own * cb.leaveShare);
        c.own -= out; c.other += out; M.lost += out;
        c.rel = c100(c.rel - 5);
      }
    }
    if(!c.maint) c.rel = c100(c.rel - cb.relDecay*0.3);
    c.other = Math.round(c.other * (1 + cb.otherRegrow));
  });
  // 3 自然流动 + 代发沉淀
  depAdd(b.drift.mean + gauss()*b.drift.sd + S.biz.payrollInflow);
  // 4 满意度回归
  S.biz.csat = c100(S.biz.csat + (b.csatHome - S.biz.csat)*b.csatRevert);
  // 5 临时任务
  if(S.biz.task && !S.biz.taskDone){ fav("huang", b.task.miss); M.taskMissed = true; }
  // 6 挑战
  S.chal = S.chal.filter(ch => {
    if(S.turn < ch.due) return true;
    const got = depTotal() - ch.start;
    if(got >= ch.target){ fav("huang", ch.win); log("good", `${ch.title}：净增${fmtWan(got)}，任务完成。黄世海在群里说了句「弹子石可以」。`); }
    else { fav("huang", ch.lose); log("bad", `${ch.title}：只做到${fmtWan(got)}，差${fmtWan(ch.target-got)}。黄世海在例会上没点你的名，点了一句「有些网点报数不负责」。`); }
    return false;
  });
  // 7 员工恢复
  S.staff.forEach(s => {
    s.fatigue = c100(s.fatigue - b.fatigueRecover + (S.biz.rallied ? 0 : 0));
    s.fav = c100(s.fav + (b.favHome - s.fav) * 0.02);
    const p = person(s.id); if(p) p.fav = s.fav;
  });
  // 8 考核
  const newYear = false;
  computeKpi(S.m);
  stepRivals(newYear);
  computeRank();
  computeCore();
  S.track.rankHistory.push(S.kpi.rank);
  S.track.scoreHistory.push(S.kpi.score);
  S.track.depHistory.push(Math.round(depTotal()));
  S.biz.rankStreak = (S.kpi.rank === 1) ? (S.biz.rankStreak||0)+1 : 0; rivalReact();
  // 9 本月报告
  const rep = {
    turn:S.turn, m:S.m, year:S.year,
    dep: depTotal(), dDep: depTotal() - M.dep0,
    fee: M.fee, cust: M.cust, card: M.card, errors: M.errors, lost: M.lost,
    rank: S.kpi.rank, prevRank: S.kpi.prevRank, score: S.kpi.score,
    taskMissed: !!M.taskMissed,
  };
  S.report = rep;
  // 10 时点存款回吐(结算后再退,下月初体现)
  return rep;
}

/* ---------- 里程碑 ---------- */
function checkMilestones(atSettle){
  const got = [];
  const lvMs = MILESTONES[S.lv] || [];
  const test = {
    dep35:  ()=> depTotal() - S.biz.timepoint >= B1().depMilestone,
    payroll:()=> S.biz.prospects.some(p=>p.won),
    noerr:  ()=> S.biz.noErrStreak >= B1().streakNoError,
    fanzha: ()=> !!S.flags.fanzhaSaved,
    rank1q: ()=> atSettle && S.m % 3 === 0 && S.kpi.rank === 1,
    dep45:  ()=> depTotal() >= BALANCE.L2.depMilestone,
    proj1:  ()=> S.biz.projects && S.biz.projects.some(p=>p.stage===3),
    allhit: ()=> !!S.biz.allHit,
    npl1:   ()=> atSettle && S.m===12 && nplRatio() < BALANCE.L2.nplMilestone,
    rank3q: ()=> atSettle && S.m % 3 === 0 && S.kpi.rank <= 3,
    wz_new: ()=> !!S.flags.wzNewPaid,
    wz_npl: ()=> atSettle && nplL3()/loansTotalL3()*100 < 1.5,
    wz_dep: ()=> depTotal() >= 4500000,
    wz_all: ()=> atSettle && S.m===12 && !!S.biz.allGrow,
    wz_rank:()=> atSettle && S.kpi.rank <= 3,
    cq_proj:()=> (S.flags.projDone||0) > 0,
    cq_r1:  ()=> !!S.flags.rating1,
    cq_unity:()=> S.biz.unity >= 80,
    cq_crisis:()=> !!S.flags.crisisGood,
    cq_rank:()=> atSettle && S.kpi.rank <= 3,
  };
  lvMs.forEach(ms => {
    if(S.milestones[ms.id]) return;
    if(test[ms.id] && test[ms.id]()){
      S.milestones[ms.id] = {turn:S.turn, age:S.age, lv:S.lv};
      const rw = ms.reward || {};
      if(rw.rep){ if(S.lv>=2) subordinates().forEach(x=>fav(x.id, rw.rep)); else allStaffFav(rw.rep); }
      if(rw.sup) fav(supId(), rw.sup);
      if(rw.huang) fav("huang", rw.huang);
      if(rw.lu){ meet("lu"); fav("lu", rw.lu); }
      if(rw.gu){ meet("gu"); fav("gu", rw.gu); }
      if(rw.budget) budgetAdd(rw.budget);
      keyEvent(ms.stmt);
      log("gold", `里程碑 · <b>${ms.name}</b>。${ms.ceremony}`);
      got.push(ms);
    }
  });
  computeCore();
  return got;
}

function canAct(id){
  if(S.phase!=="play") return {ok:false, why:"现在不能操作"};
  if(S.ap < 1) return {ok:false, why:"本月行动点用完了"};
  const b = B1();
  if(id==="hall" && S.biz.budget < b.hall.cost) return {ok:false, why:`营销费用不够（要${b.hall.cost}万）`};
  if(id==="rally" && S.biz.rallied) return {ok:false, why:"这个月已经开过动员会了"};
  if(id==="boss" && S.biz.bossDone) return {ok:false, why:"这个月已经去过支行了"};
  return {ok:true};
}

function doMaintain(cardId, prodId){
  const c = card(cardId); if(!c) return null;
  const chk = canAct("maintain"); if(!chk.ok) return null;
  const b = B1(), cb = b.card, P = b.product[prodId];
  if(!P) return null;
  apUse(1);
  const isDue = (c.due === S.m);
  const K = BALANCE.odds.L1.maintain;
  if(!roll(ODDS[1].maintain(c, prodId))){
    c.maint = true; c.rel = c100(c.rel + 1);
    let lost = 0;
    if(isDue && R() >= P.retain) lost = Math.round(c.own*cb.leaveShare*0.5);
    else if(c.other > 0 && R() < K.poach) lost = Math.round(c.own*K.poachShare);
    if(lost){ c.own -= lost; c.other += lost; }
    const lines = [
      `${c.name}听完，说再想想。临走问了一句他行的利率。`,
      `${c.name}把宣传单折起来放进包里，说回去跟家里商量。`,
      `你讲到一半，${c.name}的手机响了。接完电话，人说改天再来。`,
    ];
    log("bad", `维护<b>${c.name}</b>：` + pick(lines) + (lost ? "第二天，账上转走了一笔。" : "") + ` <span class="num">没谈成${lost?" · 存款-"+fmtWan(lost):""}</span>`);
    return {pull:0, fee:0, viol:false, fail:true, lost};
  }
  let pull = Math.round(c.other * (cb.pullBase + c.rel*cb.pullRel) * P.pull);
  pull = Math.min(pull, c.other);
  c.other -= pull; c.own += pull;
  const fee = r2(c.own * P.fee + P.feeFix);
  if(fee) feeAdd(fee);
  c.rel = c100(c.rel + cb.relMaintain);
  const p = person(c.id); if(p) p.fav = c.rel;
  // 保险对退休客户略减满意
  if(prodId==="insure" && c.type==="retire") csatAdd(P.oldCsat);
  // 续存:到期卡按产品保留率
  if(isDue){
    if(R() < P.retain) c.maint = true;
    else { c.maint = true; const out = Math.round(c.own*cb.leaveShare*0.5); c.own -= out; c.other += out; }
  } else c.maint = true;
  let viol = false;
  if(prodId==="fund" && c.risk < P.riskLevel){
    viol = true;
    const v = b.violation;
    dirt(v.clean);
    S.flags.dirtyWealth = (S.flags.dirtyWealth||0) + 1;
    const p = c.risk<=2 ? v.complainP : v.complainP*0.6;
    if(R() < p) schedule("complaintV", rint(v.delayMin, v.delayMax), {cardId:c.id});
  }
  const txt = `维护<b>${c.name}</b>（${CUST_TYPES[c.type].name} · R${c.risk}）：${pull?`从他行挪过来${fmtWan(pull)}`:"没挪过来钱"}${fee?`，中收${fmtWan(fee)}`:""}。` + (viol?"基金是R4的，她的测评不够。":"");
  log(viol?"warn":"good", txt + ` <span class="num">存款${sgn(pull,fmtWan)}</span>`);
  return {pull, fee, viol};
}

function doHall(){
  const chk = canAct("hall"); if(!chk.ok) return null;
  const h = B1().hall;
  apUse(1); budgetAdd(-h.cost);
  const lobbyBoost = staffByRole("lobby").reduce((a,s)=>a+s.mk,0)/10 + 0.8;
  const ok = roll(ODDS[1].hall()), k = ok ? 1 : BALANCE.odds.L1.hall.flop;
  const cu = Math.round(ri(h.cust)*lobbyBoost*k), dp = Math.round(ri(h.dep)*lobbyBoost*k), cd = Math.round(ri(h.card)*lobbyBoost*k);
  custAdd(cu); depAdd(dp); if(cd) cardAdd(cd); csatAdd(ok ? h.csat : 0);
  if(!ok){ log("bad", `厅堂办了一场「存款送米」。${pick(["那天下雨，米只送出去一半。","隔壁行同一天在送油，人都在那边排队。","来的多是领了米就走的，填表的没几个。"])}<span class="num">新客户+${cu} · 存款+${fmtWan(dp)} · 营销费用-${h.cost}万</span>`); return {cu, dp, cd, fail:true}; }
  log("good", `厅堂办了一场「存款送米」，门口排到了人行道上。<span class="num">新客户+${cu} · 存款+${fmtWan(dp)} · 营销费用-${h.cost}万</span>`);
  return {cu, dp, cd};
}

function doOut(kind, prospectId){
  const chk = canAct("out"); if(!chk.ok) return null;
  const o = B1().out;
  const cm = staffByRole("cm")[0];
  const boost = cm ? (0.7 + cm.mk*0.06) : 0.6;
  if(kind==="payroll"){
    const pp = S.biz.prospects.find(p=>p.id===prospectId && !p.won);
    if(!pp) return null;
    const pc = o.payroll;
    if(S.biz.budget < pc.cost) return null;
    apUse(1); budgetAdd(-pc.cost);
    const p = pc.baseP + (cm?cm.mk:3)*pc.mkP + pp.tries*pc.tryP;
    pp.tries++;
    if(R() < p){
      pp.won = true;
      const cd = Math.round(rr(pc.card) * pp.staff/90), dp = Math.round(rr(pc.dep) * pp.staff/90), cu = Math.round(rr(pc.cust) * pp.staff/90);
      cardAdd(cd); depAdd(dp); custAdd(cu);
      S.biz.payrollInflow += Math.round(pp.staff * 0.3);
      if(cm) sfav(cm.id, 4);
      log("gold", `<b>${pp.name}</b>的代发签下来了。${cm?cm.name:"你"}从财务室出来，在车里坐了五分钟才发动。<span class="num">代发户+${cd} · 存款+${fmtWan(dp)}</span>`);
      keyEvent(`拿下${pp.name}代发`);
      return {won:true};
    }
    log("", `去了趟<b>${pp.name}</b>，对方说再考虑考虑。${pp.tries>1?"比上回多聊了二十分钟。":""}`);
    return {won:false};
  }
  const t = o[kind]; if(!t) return null;
  apUse(1);
  const ok = roll(ODDS[1].out()), k = ok ? 1 : BALANCE.odds.L1.out.flop;
  const cu = Math.round(ri(t.cust)*boost*k), dp = Math.round(ri(t.dep)*boost*k), cd = Math.round(ri(t.card)*boost*k);
  custAdd(cu); depAdd(dp); if(cd) cardAdd(cd);
  if(!ok){ log("bad", `${kind==="community" ? "去弹子石社区摆了一上午摊。天热，留下电话的只有几个。" : "老街上的铺子走了一圈。有两家说上个月刚被别的行跑过。"}<span class="num">新客户+${cu} · 存款+${fmtWan(dp)}</span>`); return {cu, dp, cd, fail:true}; }
  const where = kind==="community" ? "去弹子石社区摆了一上午摊，量血压的比办业务的多" : "沿着老街一家家铺子走过去，收了一摞名片";
  log("good", `${where}。<span class="num">新客户+${cu} · 存款+${fmtWan(dp)} · 信用卡代发+${cd}</span>`);
  return {cu, dp, cd};
}

function doTrain(staffId, attr){
  const chk = canAct("train"); if(!chk.ok) return null;
  const s = staff(staffId); if(!s || !ATTR_NAME[attr]) return null;
  const t = B1().train;
  if(s[attr] >= t.max) return null;
  apUse(1);
  if(!roll(ODDS[1].train(s))){
    s.trained++; sfav(s.id, t.fav);
    log("bad", `${pick([`你带${s.name}过了一遍，${pr(s)}点头。第二天碰到同样的事，还是按老办法办的。`, `讲到一半，柜台上来了客户，${s.name}起身去忙了。那天没再接上。`, `${s.name}这阵子太累，你讲的时候${pr(s)}一直在看表。`])}<span class="num">没教会</span>`);
    return {up:0, fail:true};
  }
  const up = Math.min(t.max - s[attr], t.attr * (R() < (s.grow-1)*0.5 ? 2 : 1));
  s[attr] += up; s.trained++;
  sfav(s.id, t.fav);
  const lines = {
    mk:`你带${s.name}见了三个客户，回来的路上${pr(s)}一直在本子上记。`,
    op:`下班后你陪${s.name}把几种挂失、冻结的流程过了一遍。`,
    cp:`你把去年分行的差错通报找出来，跟${s.name}一条条对。`,
  };
  log("good", `${lines[attr]}<span class="num">${s.name} ${ATTR_NAME[attr]}+${up}</span>`);
  return {up};
}

function doRally(){
  const chk = canAct("rally"); if(!chk.ok) return null;
  const r = B1().rally;
  apUse(1);
  S.biz.rallied = true;
  S.staff.forEach(s => { s.fatigue = c100(s.fatigue + r.fatigue); sfav(s.id, r.fav); });
  if(!roll(ODDS[1].rally())){
    const k = BALANCE.odds.L1.rally, s0 = S.staff.slice().sort((a,b)=>b.fatigue-a.fatigue)[0];
    S.biz.rallyFlop = true; if(s0) s0.fatigue = c100(s0.fatigue + k.flopFat);
    log("bad", `八点二十开晨会，你把这个月的数写在白板上。${s0?s0.name:"有人"}站在最后面，散会后说孩子发烧，下午请了假。<span class="num">动员没起来 · 倦怠上升</span>`);
    return {fail:true};
  }
  log("", `八点二十开晨会，你把这个月的数写在白板上。没人说话，${pick(S.staff).name}在底下打了个呵欠。<span class="num">本月产出提高 · 倦怠上升</span>`);
  return true;
}

function doBoss(){
  const chk = canAct("boss"); if(!chk.ok) return null;
  const t = B1().task;
  apUse(1);
  S.biz.bossDone = true;
  if(!roll(ODDS[1].boss())){
    fav("huang", BALANCE.odds.L1.boss.flopFav);
    log("bad", S.biz.task && !S.biz.taskDone ? `材料交上去，黄世海翻了两页，说格式不对，让你重做。<span class="num">黄世海好感${BALANCE.odds.L1.boss.flopFav}</span>` : `你去支行汇报。黄世海在开会，你在走廊等到下班，没见上。<span class="num">黄世海好感${BALANCE.odds.L1.boss.flopFav}</span>`);
    return {fail:true};
  }
  if(S.biz.task && !S.biz.taskDone){
    S.biz.taskDone = true;
    fav("huang", t.done);
    log("", `${S.biz.task.replace(/。$/,"")}，办了。黄世海回了个「嗯」。<span class="num">黄世海好感+${t.done}</span>`);
  } else {
    fav("huang", t.report);
    log("", `你去支行汇报了一趟。黄世海听到一半接了个电话，挥手让你回去。<span class="num">黄世海好感+${t.report}</span>`);
  }
  return true;
}

function setRole(staffId, role){
  const s = staff(staffId); if(!s || !ROLE_NAME[role]) return false;
  if(S.phase!=="play") return false;
  s.role = role;
  const p = person(s.id); if(p){ p.role = ROLE_NAME[role]; p.pos = "弹子石网点"+ROLE_NAME[role]; }
  return true;
}

/* =====================================================================
   L2 南岸支行:引擎
   ===================================================================== */
const B2 = ()=> BALANCE.L2;

function depTotalL2(){ return S.biz.outlets.reduce((a,o)=>a+o.dep,0) + S.biz.corp.dep; }
function nplRatio(){ return S.biz.loans > 0 ? S.biz.npl / S.biz.loans * 100 : 0; }
function outlet(id){ return S.biz.outlets.find(o=>o.id===id); }
function project(id){ return S.biz.projects.find(p=>p.id===id); }
function subsL2(){
  const ids = S.biz.outlets.map(o=>o.mgr).concat([S.biz.corp.lead]).filter(Boolean);
  return ids.map(person).filter(Boolean);
}
function skillOf(id){ const p = person(id); return p && p.skill != null ? p.skill : 45; }
function delegK(id){ const d = B2().deleg; return d.base + skillOf(id)/100 * d.k; }
function moraleK(o){ const m = B2().morale; return m.base + o.morale/100 * m.k; }

/* L1 员工 → 人脉簿里的能力值 */
function staffSkill(s){
  const k = B2().skillFromAttr;
  return Math.round(c100(k.base + ((s.mk + s.op + s.cp) - k.off) / k.span * k.k + (s.fav - 55) * k.favK));
}

/* ---------- 进入 L2 ---------- */
function initL2(succId){

  const l1 = S.track.l1End || {dep: B1().depStart, core: S.core};
  // L1 员工写进人脉簿的能力值

  PEOPLE_L2.forEach(d => { if(!person(d.id)) S.people.push(Object.assign({lvMet:2, pos:d.role, met:true, recent:"", kind:"npc", alive:true}, d)); });

  const outlets = OUTLETS_L2.map(o => {
    const x = Object.assign({}, o);
    if(o.id === "dzs"){ x.dep = Math.round(l1.dep * b.carryDep); x.mgr = succId; }
    x.morale = b.morale.start + (o.id==="dzs" && succId ? Math.round((person(succId).fav-55)/2) : 0);
    x.target = 0; x.y0 = x.dep; x.lastInc = 0; x.supervised = false; x.mult = 1; x.hit = null;
    return x;
  });

  const loans = b.loansStart;

  };

  if(!S.loanBook) S.loanBook = [];
  // 上级:L1 收尾状态影响周启明的初始看法

  S.rivals = RIVALS_L2.map(r => Object.assign({}, r, {shift:0, score:r.base, bonus:0}));
  S.kpi = {card:[], score:0, rank:0, history:[], ytd:{}, comp:100, dep0:0, loan0:0};
  S.chal = []; S.sched = S.sched.filter(x=>x.lv===2); S.pendingEv = [];
  S.promo = { windowAt: BALANCE.tenure[2], rumored:false, bt:false, stage:null, tries:0, last:null };
  S.track.scoreHistory = []; S.track.rankHistory = [];

function spawnProject(id){
  const d = PROJ_L2.find(p=>p.id===id); if(!d) return;
  S.biz.projects.push({id:d.id, stage:0, prog:0, visits:0, gift:0, lost:false, bornAt:S.turn, landedAt:null});
  if(d.who) meet(d.who);
}

/* ---------- 考核卡 ---------- */
function issueKpiL2(){
  const b = B2();
  const g = Math.pow(b.kpiGrowth, Math.min(S.year-1, b.kpiGrowthYears));
  S.kpi.card = KPI_DEF[2].map(d => {
    const base = b.kpiTarget[d.k];
    const target = d.kind==="flow" ? Math.round(base*g) : base;
    return Object.assign({}, d, {target, actual:0, done:0, pace:0});
  });
  S.kpi.dep0 = depTotal(); S.kpi.loan0 = S.biz.loans;
  S.biz.ytd = {fee:0, profit:0};
  S.kpi.comp = 100;
  S.biz.decompDone = false;
  S.biz.outlets.forEach(o => { o.y0 = o.dep; o.target = 0; o.hit = null; o.mult = 1; });
}
function kpiActualL2(k){
  switch(k){
    case "dep":    return depTotal() - S.kpi.dep0;
    case "loan":   return S.biz.loans - S.kpi.loan0;
    case "profit": return S.biz.ytd.profit;
    case "fee":    return S.biz.ytd.fee;
    case "npl":    return r2(nplRatio());
    case "comp":   return S.kpi.comp;
  }
  return 0;
}

/* ---------- 指标分解 ---------- */
function outletPot(o){ return o.dep * B2().growth * delegK(o.mgr) * moraleK(o); }
function decompFair(){
  const tgt = S.kpi.card.find(x=>x.k==="dep").target - B2().corpShare;
  const pots = S.biz.outlets.map(outletPot), sum = pots.reduce((a,b)=>a+b,0);
  const step = B2().decomp.step;
  return {total: tgt, fair: pots.map(p => p/sum*tgt), step};
}
function decompProportional(){
  const f = decompFair();
  const arr = f.fair.map(x => Math.round(x/f.step)*f.step);
  arr[0] += f.total - arr.reduce((a,b)=>a+b,0);
  return arr;
}
function applyDecomp(alloc){
  const d = B2().decomp, f = decompFair();
  const res = [];
  S.biz.outlets.forEach((o,i) => {
    o.target = alloc[i];
    const r = f.fair[i] > 0 ? alloc[i] / f.fair[i] : 1;
    o.ratio = r2(r);
    let mor = d.moraleFit, mult = 1;
    if(r > d.over){ mor = d.moraleOver; o.overload = true; }
    else if(r > d.high){ mor = d.moraleHigh; mult = 1 + d.stretch; }
    else if(r >= 1){ mult = 1 + d.stretch; }
    else if(r < d.low){ mor = d.moraleLow; mult = 1 + d.slack; }
    o.morale = c100(o.morale + mor); o.mult = mult;
    res.push({o, r});
  });
  S.biz.decompDone = true;
  const over = res.filter(x=>x.o.overload).map(x=>x.o.name);
  log(over.length?"warn":"", `今年的存款任务拆下去了。${over.length?over.join("、")+"的负责人拿到数，没当场说话。":"四个负责人各自把数抄在本子上。"}`);
  return res;
}

/* ---------- 贷款审批队列 ---------- */
function genLoan(){
  const q = B2().queue, ts = B2().tierScore;
  const type = R() < q.microShare ? "micro" : "corp";
  const amt = Math.round(rr(q[type]) / 10) * 10;
  const coll = pick(Object.keys(ts.coll)), flow = pick(Object.keys(ts.flow)), tax = pick(Object.keys(ts.tax));
  const score = ts.coll[coll] + ts.flow[flow] + ts.tax[tax] + gauss()*ts.noise;
  let tier = score < ts.low ? "low" : (score > ts.high ? "high" : "mid");
  const it = {id:"ln"+S.monthAbs+"_"+Math.floor(R()*1e4), type, name:pick(LOAN_NAMES[type]), ind:pick(LOAN_IND[type]), amt, coll, flow, tax, tier};
  if(R() < q.relP){
    const rel = pick(LOAN_RELS);
    if(person(rel.who) && (rel.who==="zhouqm" || S.biz.outlets.some(o=>o.mgr===rel.who))){ it.rel = rel.who; it.relLine = rel.line; if(tier==="low") it.tier = "mid"; else it.tier = "high"; }
  }
  return it;
}
function fillQueue(){
  const q = B2().queue;
  const n = rint(q.min, q.max);
  S.biz.queue = [];
  for(let i=0;i<n;i++) S.biz.queue.push(genLoan());
}
function bookLoan(name, amt, tier, src){
  const b = B2();
  const def = R() < b.tierDefault[tier];
  S.loanBook.push({id:"b"+S.loanBook.length, name, amt, tier, src, lv:S.lv, at:S.monthAbs, defAt:S.monthAbs + ri(b.defaultDelay), def, done:false});
  S.biz.loans += amt;
}
function decideLoan(id, ok){
  const i = S.biz.queue.findIndex(x=>x.id===id); if(i<0) return null;
  const it = S.biz.queue[i];
  S.biz.queue.splice(i,1);
  if(ok){
    bookLoan(it.name, it.amt, it.tier, "queue");
    const fee = r1(it.amt * B2().loanFee);
    S.biz.ytd.fee += fee; S.month.fee += fee;
    if(it.rel) fav(it.rel, 3);
    log("", `批了<b>${it.name}</b>的贷款。<span class="num">贷款+${fmtWan(it.amt)}</span>`);
  } else {
    if(it.rel){ fav(it.rel, -4); log("", `退了<b>${it.name}</b>的材料。${person(it.rel).name}那边没再提这事。`); }
    else log("", `退了<b>${it.name}</b>的材料。`);
  }
  return it;
}

/* ---------- 回合开始 ---------- */
function monthStartL2(first){
  const b = B2();
  S.ap = S.apMax = BALANCE.ap[2];
  if(S.flags.apDebt){ S.ap = Math.max(0, S.ap - S.flags.apDebt); S.flags.apDebt = 0; }
  S.month = {dep0: depTotal(), loan0: S.biz.loans, npl0: S.biz.npl, fee:0, profit:0, compHit:0, newNpl:0, landed:[], defaults:[], expired:0};
  S.biz.outlets.forEach(o => { o.supervised = false; o.supFlop = false; o.dep0 = o.dep; });
  S.biz.campaignDone = false; S.biz.reported = false;
  if(!first) S.biz.budget = r1(S.biz.budget + b.budgetMonthly);
  fillQueue();
  // 新项目
  if(!S.biz.projQueue.length){
    const old = S.biz.projects.filter(p=>p.stage===3 || p.lost).map(p=>p.id);
    old.forEach(id => { const d = PROJ_L2.find(x=>x.id===id); const nid = id+"_"+S.turn; if(!PROJ_L2.find(x=>x.id===nid)){ PROJ_L2.push(Object.assign({}, d, {id:nid, name:d.name.replace(/(二期)*$/,"")+"二期", dep:Math.round(d.dep*0.7), loan:Math.round(d.loan*0.7), who:null})); S.biz.projQueue.push(nid); } });
  }
  if(!first && S.turn >= S.biz.nextProjAt && S.biz.projQueue.length && S.biz.projects.filter(p=>p.stage<3 && !p.lost).length < b.project.max){
    spawnProject(S.biz.projQueue.shift());
    S.biz.nextProjAt = S.turn + b.project.spawnEvery;
    const p = S.biz.projects[S.biz.projects.length-1], d = PROJ_L2.find(x=>x.id===p.id);
    log("", `对公看板上多了一张卡：<b>${d.name}</b>，${d.what}。`);
  }
}

/* ---------- 月末结算 ---------- */
function settleL2(){
  const b = B2(), M = S.month;
  const kmh = S.m <= 3 ? (B1().kmhMult||1) : 1;
  // 1 网点(委托:负责人去做)
  let retail = 0;
  S.biz.outlets.forEach(o => {
    const dk = delegK(o.mgr), mk = moraleK(o);
    let inc = o.dep * b.growth * dk * mk * (o.mult||1) * kmh;
    if(o.supervised && !o.supFlop) inc *= b.supervise.mult;
    inc += gauss() * o.dep * b.noise;
    if(!o.mgr) inc *= 0.5;
    o.dep = Math.round(o.dep + inc);
    o.lastInc = o.dep - o.dep0;
    const fee = o.dep * b.feeRate * dk;
    S.biz.ytd.fee += fee; M.fee += fee;
    retail += o.dep * b.retailK * dk;
    o.morale = c100(o.morale + (b.morale.home - o.morale) * b.morale.revert);
  });
  // 2 对公
  const ck = delegK(S.biz.corp.lead);
  S.biz.corp.dep = Math.round(S.biz.corp.dep * (1 + b.corpGrowth * ck));
  S.biz.projects.forEach(p => {
    if(p.lost || p.stage >= 2) return;
    if(R() < skillOf(S.biz.corp.lead) * b.project.autoK){ projAdvance(p, true); }
  });
  // 3 贷款
  S.biz.loans = Math.round(S.biz.loans * (1 - b.amort) + retail);
  const baseNew = S.biz.loans * b.nplBase.rate / 12;
  let newNpl = baseNew;
  S.loanBook.forEach(l => {
    if(l.def && !l.done && S.monthAbs >= l.defAt){
      l.done = true; newNpl += l.amt; M.defaults.push(l);
      log("bad", `<b>${l.name}</b>逾期了，进了不良。${l.lv < S.lv ? "这笔是前任手上批的。" : ""}<span class="num">不良+${fmtWan(l.amt)}</span>`);
    }
  });
  S.biz.npl = Math.max(0, Math.round(S.biz.npl * (1 - b.nplBase.resolve) + newNpl));
  M.newNpl = newNpl;
  // 4 过期的审批件
  M.expired = S.biz.queue.length; S.biz.queue = [];
  settleChalL2();
  // 5 利润
  const r = b.spread;
  const profit = depTotal() * r.dep / 12 + S.biz.loans * r.loan / 12 + M.fee - b.expense - newNpl * b.provision - (M.spent||0);
  S.biz.ytd.profit += profit; M.profit = profit; S.biz.lastProfit = profit;
  // 6 回归
  S.biz.csat = c100(S.biz.csat + (b.csatHome - S.biz.csat) * b.csatRevert);
  subsL2().forEach(p => { p.fav = c100(p.fav + (b.favHome - p.fav) * b.favRevert); });
  // 7 考核
  computeKpi(S.m);
  stepRivals(false);
  computeRank();
  computeCore();
  S.track.rankHistory.push(S.kpi.rank);
  S.track.scoreHistory.push(S.kpi.score);
  S.track.depHistory.push(Math.round(depTotal()));
  S.biz.rankStreak = (S.kpi.rank === 1) ? (S.biz.rankStreak||0)+1 : 0; rivalReact();
  S.report = {
    turn:S.turn, m:S.m, year:S.year,
    dep: depTotal(), dDep: depTotal() - M.dep0, loans:S.biz.loans, dLoan:S.biz.loans - M.loan0,
    profit, npl: nplRatio(), fee:M.fee, rank:S.kpi.rank, prevRank:S.kpi.prevRank, score:S.kpi.score,
    expired: M.expired, defaults: M.defaults.length, landed: M.landed.slice(),
    outlets: S.biz.outlets.map(o=>({name:o.name, inc:o.lastInc})),
  };
  return S.report;
}

/* 项目推进 */
function projAdvance(p, auto){
  const b = B2().project, d = PROJ_L2.find(x=>x.id===p.id);
  if(p.lost || p.stage >= 3) return null;
  if(p.stage < 2){
    p.prog++;
    if(p.prog >= b.need[p.stage]){ p.stage++; p.prog = 0; if(!auto) log("good", `<b>${d.name}</b>推到了「${PROJ_STAGES[p.stage]}」。`); else log("", `${person(S.biz.corp.lead).name}把<b>${d.name}</b>推到了「${PROJ_STAGES[p.stage]}」。`); }
    else if(!auto) log("", `<b>${d.name}</b>又往前走了一步。`);
    return {stage:p.stage};
  }
  // 审批
  const pr = Math.min(b.cap, b.approveBase - b.risk[d.tier] + p.visits*b.visit + p.gift*b.gift + (S.flags.projBonus && S.flags.projBonus[p.id] || 0));
  if(R() < pr){
    p.stage = 3; p.landedAt = S.turn;
    S.biz.corp.dep += d.dep;
    if(d.loan) bookLoan(d.name, d.loan, d.tier, "project");
    if(S.month) S.month.landed.push(d.name);
    keyEvent(`${d.name}项目落地`);
    log("gold", `<b>${d.name}</b>落地了。${d.what}，合同签在周五下午。<span class="num">存款+${fmtWan(d.dep)}${d.loan?" · 贷款+"+fmtWan(d.loan):""}</span>`);
    if(d.who) fav(d.who, 8);
    return {landed:true};
  }
  p.lost = true;
  log("bad", `<b>${d.name}</b>在分行贷审会上没过。${d.tier==="high"?"风险部的意见写了两页。":"意见只有一行：再看看。"}`);
  return {lost:true};
}

/* 年终:网点任务完成情况 */
function yearEndL2(){
  const y = B2().yearEnd;
  let all = true;
  S.biz.outlets.forEach(o => {
    const got = o.dep - o.y0;
    o.hit = o.target ? got >= o.target : true;
    if(!o.hit) all = false;
    o.morale = c100(o.morale + (o.hit ? y.hit : y.miss));
    if(o.mgr) fav(o.mgr, o.hit ? 3 : -2);
    o.lastYear = {got, target:o.target};
  });
  S.biz.allHit = all;
  S.biz.outlets.forEach(o => o.overload = false);
}
/* =====================================================================
   L3 万州分行:引擎(按季)
   ===================================================================== */
const B3 = ()=> BALANCE.L3;
const LOAN_TYPES = ["corp","micro","retail"];
const LOAN_TYPE_NAME = {corp:"对公", micro:"小微", retail:"个贷", platform:"平台"};

function area(id){ return S.biz.areas.find(a=>a.id===id); }
function branch(id){ return S.biz.branches.find(b=>b.id===id); }
function loansTotalL3(){ const l = S.biz.loans; return l.corp + l.micro + l.retail + l.platform; }
function nplL3(){ return S.biz.npa.reduce((a,x)=>a+x.amt,0); }
function depTotalL3(){ return S.biz.branches.reduce((a,b)=>a+b.dep,0) + S.biz.newOutlets.reduce((a,o)=>a+o.dep,0); }
function outletCount(){ return S.biz.branches.reduce((a,b)=>a+b.outlets,0) + S.biz.newOutlets.length; }
function effL3(){ return depTotalL3() / 10000 / Math.max(1, outletCount()); }
function subsL3(){ return S.biz.branches.map(b=>b.mgr).concat(Object.values(S.biz.lineHeads)).filter((v,i,a)=>v && a.indexOf(v)===i).map(person).filter(Boolean); }
function areaGrowth(a){ const g = B3().area; return g.g0 + a.heat/100*g.heatK - a.comp/100*g.compK; }
function delegK3(id){ const d = B3().deleg; return d.base + skillOf(id)/100 * d.k; }
function qName(){ return ["一","二","三","四"][Math.max(0, Math.round(S.m/3)-1)] + "季度"; }

/* ---------- 进入 L3 ---------- */
function initL3(){
  const b = B3();
  PEOPLE_L3.concat(RESERVES_L3).forEach(d => { if(!person(d.id)) S.people.push(Object.assign({lvMet:3, pos:d.role, met:true, recent:"", kind:"sub", alive:true, group:"部下"}, d)); });
  RESERVES_L3.forEach(d => { const p = person(d.id); p.kind = "reserve"; });
  const branches = BRANCHES_L3.map(x => Object.assign({}, x, {renov:0, y0:x.dep, dep0:x.dep, lastInc:0}));
  const depT = branches.reduce((a,x)=>a+x.dep,0);
  const loansT = Math.round(depT * b.ldr);
  const loans = {corp:Math.round(loansT*b.loanMix.corp), micro:Math.round(loansT*b.loanMix.micro), retail:Math.round(loansT*b.loanMix.retail), platform:0};
  // 公司部:罗建够格就是他
  const luo = person("luojian");
  const corpHead = (luo && luo.skill >= 60 && luo.pos.indexOf("离职")<0) ? "luojian" : "duanbin";
  if(corpHead === "luojian"){ luo.pos = "万州分行公司部总经理"; luo.recent = "调到万州，管公司部"; luo.kind = "sub"; }
  else { person("duanbin").kind = "sub"; person("duanbin").pos = "万州分行公司部总经理"; }
  S.biz = {
    areas: AREAS_L3.map(a => Object.assign({}, a)),
    branches, newOutlets: [], outletSeq: 0,
    loans, mixTarget: Object.assign({}, b.loanMix),
    npa: [], npaSeq: 0, restr: [], writeoffUsed: 0,
    budget: b.budgetQ, tilt: null,
    lineHeads: {corp:corpHead, retail:"liujia", risk:"wangming", ops:"xiongw", hr:"tanmin"},
    csat: 55, ytd: {profit:0, fee:0}, disposedQ: 0, platformDone: [], platformOffer: null,
    rankStreak: 0, reported: false, opened: 0, closed: 0,
  };
  person("liujia").kind = "sub"; person("liujia").pos = "万州分行零售部总经理";
  // 起始不良,拆成若干户
  let npl0 = Math.round(loansT * b.nplStart);
  while(npl0 > 0){ const amt = Math.min(npl0, Math.round(rr([4000, 9000]))); addNpa(amt, pick(LOAN_TYPES), "前任留下"); npl0 -= amt; }
  S.rivals = RIVALS_L3.map(r => Object.assign({}, r, {shift:0, score:r.base, bonus:0}));
  S.kpi = {card:[], score:0, rank:0, history:[], ytd:{}, comp:100, dep0:0, loan0:0};
  S.chal = []; S.sched = S.sched.filter(x=>x.lv===3); S.pendingEv = [];
  S.promo = { windowAt: BALANCE.tenure[3], rumored:false, bt:false, stage:null, tries:0, last:null };
  S.track.scoreHistory = []; S.track.rankHistory = [];
  S.flags.grayAtL3 = S.flags.grayCount || 0;
  S.turn = 1; S.m = 3; S.year = 1;
  issueKpi();
  computeAll();
  monthStart(true);
}

function addNpa(amt, type, origin, name){
  S.biz.npaSeq++;
  S.biz.npa.push({id:"npa"+S.biz.npaSeq, name: name || (() => { const used = new Set(S.biz.npa.filter(x=>!x.stage).map(x=>x.name)); const free = NPA_NAMES.filter(n=>!used.has(n)); return pick(free.length ? free : NPA_NAMES); })(), amt:Math.round(amt), type, stage:null, until:0, origin: origin||"", orig:Math.round(amt)});
}

/* ---------- 考核卡 ---------- */
function issueKpiL3(){
  const b = B3();
  const g = Math.pow(b.kpiGrowth, Math.min(S.year-1, b.kpiGrowthYears));
  S.kpi.card = KPI_DEF[3].map(d => {
    let target = b.kpiTarget[d.k];
    if(d.k==="eff") target = r1(effL3() * b.effTargetK);
    else if(d.kind==="flow") target = Math.round(target*g);
    return Object.assign({}, d, {target, actual:0, done:0, pace:0});
  });
  S.kpi.dep0 = depTotal(); S.kpi.loan0 = loansTotalL3();
  S.biz.ytd = {profit:0, fee:0};
  S.kpi.comp = 100;
  S.biz.writeoffUsed = 0;
  S.biz.branches.forEach(x => { x.y0 = x.dep; });
  S.biz.expenseQ = depTotal() * b.expenseRate / 4;
  S.biz.quota = Math.round((loansTotalL3() - S.biz.loans.platform) * (1 + b.quotaYear));
}
function kpiActualL3(k){
  switch(k){
    case "profit": return S.biz.ytd.profit;
    case "dep":    return depTotal() - S.kpi.dep0;
    case "loan":   return loansTotalL3() - S.kpi.loan0;
    case "npl":    return r2(nplL3() / loansTotalL3() * 100);
    case "eff":    return r1(effL3());
    case "comp":   return S.kpi.comp;
  }
  return 0;
}

/* ---------- 回合开始 ---------- */
function monthStartL3(first){
  const b = B3();
  S.ap = S.apMax = BALANCE.ap[3];
  if(S.flags.apDebt){ S.ap = Math.max(0, S.ap - S.flags.apDebt); S.flags.apDebt = 0; }
  S.month = {dep0: depTotal(), loan0: loansTotalL3(), npl0: nplL3(), profit:0, fee:0, spent:0, newNpl:0, recovered:0, defaults:[], nanan:[]};
  S.biz.branches.forEach(x => x.dep0 = x.dep);
  S.biz.disposedQ = 0; S.biz.reported = false;
  if(!first) S.biz.budget = Math.round(S.biz.budget + b.budgetQ);
}

/* ---------- 季末结算 ---------- */
function settleL3(){
  const b = B3(), M = S.month, tilt = S.biz.tilt, t = b.tilt;
  // 1 片区热度
  S.biz.areas.forEach(a => { const d = b.area.heatDrift[a.id]; if(d) a.heat = c100(a.heat + d/4); a.rep = c100(a.rep + (55 - a.rep)*0.05); });
  // 2 支行存款(委托给支行行长)
  S.biz.branches.forEach(x => {
    const a = area(x.area);
    let inc = x.dep * areaGrowth(a) * delegK3(x.mgr) * (1 + x.renov) * (tilt==="retail" ? t.retailDep : 1);
    inc += gauss() * x.dep * 0.003;
    x.dep = Math.round(x.dep + inc); x.lastInc = x.dep - x.dep0;
  });
  // 3 新网点爬坡
  S.biz.newOutlets.forEach(o => {
    o.age++;
    if(o.dep < o.cap) o.dep = Math.min(o.cap, o.dep + o.ramp);
    o.earned += o.dep * b.spread.dep / 4 - b.outlet.costY / 4;
    if(!o.paid && o.earned >= b.outlet.build){ o.paid = true; S.flags.wzNewPaid = true; log("good", `${area(o.area).name}的新网点把投进去的钱赚回来了。`); }
  });
  // 4 贷款增长与结构
  const L = S.biz.loans;
  const base = loansTotalL3() - L.platform;
  let room = Math.max(0, S.biz.quota - base);
  const gk = {corp: tilt==="corp" ? t.corpLoan : 1, micro: tilt==="retail" ? t.retailLoan : 1, retail: tilt==="retail" ? t.retailLoan : 1};
  let want = {}; let sumW = 0;
  LOAN_TYPES.forEach(k => { want[k] = L[k] * b.loanGrowthQ * gk[k] * (0.9 + gauss()*0.05); sumW += want[k]; });
  const scale = sumW > room ? room / sumW : 1;
  LOAN_TYPES.forEach(k => { L[k] = Math.round(L[k] + want[k]*scale); });
  // 结构往目标挪
  const tot = L.corp + L.micro + L.retail;
  let moved = 0;
  LOAN_TYPES.forEach(k => { const cur = L[k]/tot, tgt = S.biz.mixTarget[k]; const d = clamp(tgt - cur, -b.mixStep, b.mixStep); moved += Math.abs(d); L[k] = Math.round(L[k] + d*tot); });
  // 5 新增不良
  let newNpl = 0;
  LOAN_TYPES.forEach(k => { newNpl += L[k] * b.nplRate[k] / 4 * (tilt==="risk" ? t.riskNpl : 1); });
  const parts = rint(b.npaSplit[0], b.npaSplit[1]);
  for(let i=0;i<parts;i++) addNpa(newNpl/parts, pick(LOAN_TYPES), "本季新增");
  (S.loanBook||[]).forEach(l => {
    if(!l.def || l.done || S.monthAbs < l.defAt) return;
    l.done = true;
    if(l.lv === 3){ addNpa(l.amt, l.src==="platform"?"platform":"corp", "你批的", l.name); newNpl += l.amt; M.defaults.push(l);
      log("bad", `<b>${l.name}</b>逾期，进了不良。这笔是你在万州批的。<span class="num">不良+${fmtWan(l.amt)}</span>`); }
    else if(l.lv === 2){ if(S.carry.l2) S.carry.l2.npl = (S.carry.l2.npl||0) + l.amt; M.nanan.push(l); S.flags.nananDefault = (S.flags.nananDefault||[]).concat([l.name]);
      log("bad", `南岸支行那边传来消息：<b>${l.name}</b>逾期了。批贷款的时候，南岸的行长是你。`); }
  });
  M.newNpl = newNpl;
  // 6 处置中的不良
  const dp = b.dispose;
  let recovered = 0;
  S.biz.npa.forEach(x => {
    if(x.stage && S.turn >= x.until){
      const rec = Math.round(x.amt * dp[x.stage].rec * (tilt==="risk" ? t.riskRecover : 1));
      recovered += rec; x.amt -= rec;
      log("good", `${x.name}${x.stage==="collect"?"催收":"诉讼"}有了结果，收回${fmtWan(rec)}。`);
      x.stage = null;
    } else if(!x.stage){ x.amt = Math.round(x.amt * (1 - b.naturalResolve)); }
  });
  S.biz.npa = S.biz.npa.filter(x => x.amt > 50);
  S.biz.restr = S.biz.restr.filter(r => {
    if(S.turn < r.at) return true;
    if(r.redef){ addNpa(r.amt, r.type, "重组后又逾期", r.name); newNpl += r.amt; log("bad", `${r.name}重组以后又还不上了，回到不良。`); }
    return false;
  });
  M.recovered = recovered;
  // 7 利润
  const dep = depTotal();
  let income = dep * b.spread.dep / 4;
  LOAN_TYPES.concat(["platform"]).forEach(k => income += L[k] * b.spread[k] / 4);
  const fee = dep * b.feeRate / 4;
  const outletCost = S.biz.newOutlets.length * b.outlet.costY / 4;
  const expense = S.biz.expenseQ * (tilt==="ops" ? t.opsExpense : 1) + outletCost;
  const profit = income + fee - expense - newNpl * b.provision + recovered * b.provision - (M.spent||0);
  S.biz.ytd.profit += profit; S.biz.ytd.fee += fee; M.profit = profit;
  // 8 条线倾斜的持续效果
  if(tilt === "ops") S.kpi.comp = c100(S.kpi.comp + t.opsComp);
  if(tilt === "hr") S.biz.branches.forEach(x => { const p = person(x.mgr); if(p) p.skill = Math.min(90, (p.skill||50) + t.hrSkill); });
  subsL3().forEach(p => { p.fav = c100(p.fav + (55 - p.fav) * 0.03); });
  S.biz.csat = Math.round(S.biz.areas.reduce((a,x)=>a+x.rep,0) / S.biz.areas.length);
  settleChalGeneric();
  // 9 考核
  computeKpi(S.m);
  stepRivals(false);
  computeRank();
  computeCore();
  S.track.rankHistory.push(S.kpi.rank);
  S.track.scoreHistory.push(S.kpi.score);
  S.track.depHistory.push(Math.round(dep));
  S.biz.rankStreak = (S.kpi.rank === 1) ? (S.biz.rankStreak||0)+1 : 0; rivalReact();
  S.report = {
    turn:S.turn, q:qName(), dep, dDep: dep - M.dep0, loans: loansTotalL3(), dLoan: loansTotalL3() - M.loan0,
    profit, npl: nplL3()/loansTotalL3()*100, newNpl, recovered, rank:S.kpi.rank, prevRank:S.kpi.prevRank, score:S.kpi.score,
    defaults: M.defaults.length, nanan: M.nanan.map(l=>l.name), quotaFull: room <= 0,
  };
  return S.report;
}

function yearEndL3(){
  S.biz.allGrow = S.biz.branches.every(x => x.dep > x.y0);
}
/* =====================================================================
   L4 重庆分行:引擎(按季)
   ===================================================================== */
const B4 = ()=> BALANCE.L4;
function inst(id){ return S.biz.inst.find(x=>x.id===id); }
function depTotalL4(){ return S.biz.inst.reduce((a,x)=>a+x.dep,0); }
function loansL4(){ return S.biz.inst.reduce((a,x)=>a+x.loans,0); }
function nplL4(){ return S.biz.inst.reduce((a,x)=>a+x.npl,0); }
function rwaL4(){ return loansL4() * B4().rwaK + S.biz.projects.filter(p=>!p.done).reduce((a,p)=>a+STRAT_L4.find(s=>s.id===p.id).rwa,0); }
function capRoom(){ return S.biz.capital / B4().minCar - rwaL4(); }
function deputy(line){ return S.biz.deputies.find(d=>d.line===line); }
function lineK(line){ const d = deputy(line); const L = B4().lineK; const fit = d ? d.fit[line] : 50; return (L.base + fit/100*L.k) * (0.9 + S.biz.unity/100*0.2); }
function subsL4(){ return S.biz.deputies.map(d=>person(d.id)).filter(Boolean); }
function ratingNow(){
  const r = B4().rating;
  const npl = nplL4()/loansL4()*100;

function kpiActualL4(k){

    case "profit": return S.biz.ytd.profit;
    case "scale":  return depTotalL4() + loansL4() - S.kpi.scale0;
    case "npl":    return r2(nplL4()/loansL4()*100);
    case "roe":    return r1(S.biz.ytd.profit * (12/Math.max(3,S.m)) / S.biz.capital * 100);

  S.month = {dep0: depTotalL4(), loan0: loansL4(), profit:0, spent:0, newNpl:0, defaults:[]};
  S.biz.inst.forEach(x => x.dep0 = x.dep);

}

function settleL4(){
  const b = B4(), M = S.month;
  const kR = lineK("retail"), kC = lineK("corp"), kRisk = lineK("risk"), kOps = lineK("ops");
  const room = capRoom();
  let newNpl = 0;
  S.biz.inst.forEach(x => {
    const dk = 0.6 + x.skill/100*0.6;
    let inc = x.dep * b.growthQ * x.g * dk * kR * (x.focus ? b.focus : 1) + gauss()*x.dep*0.002;
    x.dep = Math.round(x.dep + inc); x.lastInc = x.dep - x.dep0;
    const want = Math.max(0, x.dep * x.ldr - x.loans) + x.loans * b.growthQ * 0.5 * kC;
    x.loans = Math.round(x.loans + (room > 0 ? want * 0.5 : 0));
    const nn = x.loans * b.nplRate / 4 / kRisk;
    x.npl = Math.round(x.npl * (1 - b.nplResolveQ) + nn); newNpl += nn;
  });
  // 跨关旧账:南岸(L2)和万州(L3)批的贷款
  (S.loanBook||[]).forEach(l => {
    if(!l.def || l.done || S.monthAbs < l.defAt) return;
    l.done = true;
    const row = l.lv === 2 ? inst("na") : (l.lv === 3 ? inst("wz") : null);
    if(!row) return;
    row.npl += l.amt; newNpl += l.amt; M.defaults.push(l);
    log("bad", `${row.name}报上来一笔不良：<b>${l.name}</b>，${fmtWan(l.amt)}。${l.lv===2?"批的时候，南岸的行长是你。":"这笔是你在万州签的。"}`);
  });
  // 战略项目
  S.biz.projects.forEach(p => {
    if(p.done) return;
    if(R() < skillOfDeputy("corp") * b.proj.autoK) p.prog++;
    if(p.prog >= STRAT_L4.find(s=>s.id===p.id).q) finishProject(p);
  });
  // 利润(税后)
  const dep = depTotalL4(), loans = loansL4();
  const pre = dep*b.spreadDep/4 + loans*b.spreadLoan/4 + dep*b.feeRate/4 - S.biz.expenseQ - newNpl*b.provision - (M.spent||0) + (M.once||0);
  const profit = pre * (1 - b.tax);
  S.biz.ytd.profit += profit; M.profit = profit; M.newNpl = newNpl;
  settleChalGeneric();
  S.kpi.comp = c100(S.kpi.comp + (kOps - 1) * 10);
  S.biz.unity = c100(S.biz.unity + (60 - S.biz.unity)*0.05);
  S.biz.csat = c100(S.biz.csat + (60 - S.biz.csat)*0.1 - (S.biz.crisisAdj||0)*2);
  subsL4().forEach(p => { p.fav = c100(p.fav + (55 - p.fav)*0.03); });
  computeKpi(S.m);
  stepRivals(false);
  computeRank();
  computeCore();
  S.track.rankHistory.push(S.kpi.rank);
  S.track.scoreHistory.push(S.kpi.score);
  S.track.depHistory.push(Math.round(dep));
  S.biz.rankStreak = (S.kpi.rank === 1) ? (S.biz.rankStreak||0)+1 : 0; rivalReact();
  S.report = {turn:S.turn, q:qName(), dep, dDep:dep-M.dep0, loans, dLoan:loans-M.loan0, profit, npl:nplL4()/loans*100,
    rating:ratingNow(), rank:S.kpi.rank, prevRank:S.kpi.prevRank, score:S.kpi.score, capRoom:capRoom(), defaults:M.defaults.map(l=>l.name)};
  return S.report;
}

  const yy = inst("yyb"); yy.dep += Math.round(s.scale*0.6); yy.loans += Math.round(s.scale*0.4);

function settleL5(){
  const b = B5(), d = b.dial, D = S.biz.dials, M = S.month, st = b.strategy[S.biz.strategy] || {};
  // 降息:第 2 回合起每半年压一次
  if(S.turn >= b.cut.from) S.biz.cutLevel++;
  const lSpread = Math.max(0.004, b.spreadLoan - S.biz.cutLevel*b.cut.loan) * (st.spread||1);
  const dSpread = Math.max(0.012, b.spreadDep - S.biz.cutLevel*b.cut.dep - (D.price-3)*d.price.spread);
  // 数字化:投入进队列,两回合后见效
  const dSpend = D.digital * d.digital.costPer;
  S.biz.digitalQ.push(dSpend);
  S.biz.digitalStock *= (1 - d.digital.dep);
  if(S.biz.digitalQ.length > d.digital.lag) S.biz.digitalStock += S.biz.digitalQ.shift();
  const digiK = Math.min(d.digital.maxCut, S.biz.digitalStock / d.digital.per * 0.02);
  // 网点
  S.biz.outlets = Math.max(15000, S.biz.outlets + (D.branch-3)*d.branch.outletsPer);
  S.biz.csat = c100(S.biz.csat + (D.branch-3)*Math.abs(d.branch.rep) + (60 - S.biz.csat)*0.1);
  // 存款
  const reg = S.biz.regions.reduce((a,r)=>a + r.share * r.g * (r.boost>0 ? b.survey.g : 1), 0);
  const depG = (b.baseDepG + (S.biz.csat-60)*0.0003 + (D.price-3)*d.price.depG + (digiK-0.1)*d.digital.depG*10 + (D.branch-3)*d.branch.depG) * reg * (st.g||1);
  S.biz.dep = Math.round(S.biz.dep * (1 + depG + gauss()*0.002));
  S.biz.regions.forEach(r => { if(r.boost>0) r.boost--; });
  // 贷款(资本够才放)
  const carOk = carL5() > 10.5;
  const loanG = carOk ? (b.baseLoanG + (D.credit-3)*d.credit.loanG) * (st.g||1) : 0.005;
  S.biz.loans = Math.round(S.biz.loans * (1 + loanG));
  S.biz.creditQ.push((D.credit-3)*d.credit.npl);
  const lagNpl = S.biz.creditQ.length > d.credit.lag ? S.biz.creditQ.shift() : 0;
  const newNpl = S.biz.loans * (b.nplRate/2 + lagNpl/2) * (st.npl||1);
  S.biz.npl = Math.round(S.biz.npl * (1 - b.nplResolveH) + newNpl);
  // 利润
  const expense = S.biz.dep * b.expenseRate / 2 * S.biz.expenseK * (1 - digiK) * (1 + (S.biz.outlets - b.outlets)/b.outlets * 0.8);
  const pre = S.biz.dep*dSpread/2 + S.biz.loans*lSpread/2 + S.biz.dep*b.feeRate/2 - expense - newNpl*b.provision - dSpend - (M.spent||0) + (M.once||0);
  const profit = pre * (1 - b.tax);
  S.biz.ytd.profit += profit; M.profit = profit;
  if(profit > 0) S.biz.capital += Math.round(profit * b.retain);
  // 同业
  S.biz.peers.forEach(p => { p.dep = Math.round(p.dep * (1 + p.g/1 * 1 + gauss()*0.004)); });
  S.biz.lastSpread = {l:lSpread, d:dSpread};
  computeKpi(S.m);
  computeRankL5();
  computeCore();
  S.track.scoreHistory.push(S.kpi.score);
  S.track.rankHistory.push(rankL5());
  S.report = {turn:S.turn, dep:S.biz.dep, dDep:S.biz.dep-M.dep0, loans:S.biz.loans, dLoan:S.biz.loans-M.loan0, profit, npl:S.biz.npl/S.biz.loans*100,
    car:carL5(), rating:ratingL5(), rank:rankL5(), spread:lSpread, outlets:S.biz.outlets, digi:digiK};

}

function oddsClamp(p){ const o = BALANCE.odds; return clamp(p, o.min, o.max); }
function oddsTier(p){
  const o = BALANCE.odds; p = oddsClamp(p);
  return p >= o.sure ? {k:"sure", t:"有把握"} : (p >= o.maybe ? {k:"maybe", t:"看情况"} : {k:"risky", t:"悬"});
}
function oddsChip(p){ if(p == null) return ""; const t = oddsTier(p); return `<i class="odds odds-${t.k}">${t.t}</i>`; }
function roll(p){
  const ok = R() < oddsClamp(p);
  const r = S.track.rolls = S.track.rolls || {n:0, fail:0};
  r.n++; if(!ok) r.fail++;
  return ok;
}

    hall: () => { const k = BALANCE.odds.L1.hall; return k.base + staffByRole("lobby").reduce((a,s)=>a+s.mk,0)*k.mk + (S.biz.csat-80)*k.csat; },

function doOpenOutlet(aid){

  S.biz.budget -= o.build; S.month.spent += o.build;
  // 爬坡速度看热度和竞争,封顶看人口
  const cold = !roll(ODDS[3].open(a));
  const ramp = Math.round((o.rampMin + (o.rampMax - o.rampMin) * clamp((a.heat - a.comp*0.5)/80, 0, 1)) * (cold ? BALANCE.odds.L3.open.coldRamp : 1));
  const cap = Math.round(o.capMin + (o.capMax - o.capMin) * clamp(a.pop/60 * 0.6 + a.heat/100*0.4, 0, 1));
  S.biz.outletSeq++;
  S.biz.newOutlets.push({id:"no"+S.biz.outletSeq, area:aid, dep:0, ramp, cap, age:0, earned:-o.build, paid:false});
  a.rep = c100(a.rep + o.repOpen);

  keyEvent(`在万州${a.name}开了新网点`);
  if(cold){ log("bad", `${a.name}的新网点挂牌了。头一个月进门的人，一天不到二十个。对面那家行开了五年，街坊都认它。<span class="num">爬坡慢</span>`); return {ramp, cap, fail:true}; }

function disposeCap(){ return B3().dispose.perQ + (S.biz.tilt==="risk" ? B3().dispose.riskBonus : 0); }
function disposeNpa(id, how){
  const x = S.biz.npa.find(n=>n.id===id); if(!x || x.stage) return null;
  if(S.biz.disposedQ >= disposeCap()) return null;
  const d = B3().dispose;
  if(how === "writeoff"){
    if(S.biz.writeoffUsed + x.amt > d.writeoff.quotaY) return null;
    S.biz.writeoffUsed += x.amt;
    S.biz.npa = S.biz.npa.filter(n=>n!==x);
    S.biz.disposedQ++;
    log("", `${x.name}核销了。${fmtWan(x.amt)}从报表上拿掉，报告送去了分行。`);
    return true;
  }
  if(how === "restr"){
    S.biz.npa = S.biz.npa.filter(n=>n!==x);
    S.biz.restr.push({name:x.name, amt:x.amt, type:x.type, at:S.turn + d.restr.redefQ, redef: R() < d.restr.redef});
    S.biz.disposedQ++;
    log("", `和${x.name}谈了重组，还款期往后推了两年。`);
    return true;
  }
  const m = d[how]; if(!m) return null;
  const cost = Math.round(x.amt * m.cost);
  S.month.spent += cost;
  x.stage = how; x.until = S.turn + m.q;
  S.biz.disposedQ++;
  if(how==="sue" && R() < m.noiseP){ const a = pick(S.biz.areas); a.rep = c100(a.rep - 4); log("warn", `起诉${x.name}的事上了本地论坛，帖子标题是「银行逼死老厂」。`); }
  else log("", `${x.name}转${how==="collect"?"催收":"诉讼"}。${how==="sue"?"律师函是周五寄出去的。":"风险部派了两个人盯着。"}`);
  return true;
}
